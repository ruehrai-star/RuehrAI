openapi: 3.0.3
info:
  title: RuehrAI API
  version: 0.19.6
  description: |
    Dev-Team slice (v0). The backend issues its own JWTs and reads a local
    Postgres database via `DATABASE_URL`. Clients call this API; they do not
    talk to the database.

    Base URL is environment-driven. Local default is `http://localhost:3000`
    (`PORT`, default 3000). Deployed clients should take the base URL from
    their own configuration and use this document as the contract.

    Local migrations seed a development user `dev@ruehrai.local` /
    `dev-password`. That account is a fixture for local runs, not a production
    credential. `POST /auth/register` creates further users in `app.users`.
    `POST /auth/logout` revokes that access token until it expires.

    Customer inputs (target-region list, store addresses, monthly revenue) are
    stored in schema `app` and are visible only to the user id in the token.
    The signed-in user has a list of target regions. That list is the set used
    for the location search, not a single overwrite slot. `0.6.1` adds
    `gemeinde` to `CatalogLevel` for a municipality (grain `ags`).
    `0.7.0` adds `POST /address-pair`: two addresses, looked up by postal code
    only, returning Gemeinde / Kreis / Land topics from Brain.
    `0.8.0` adds `AnalysisPattern.yearlySeries`: stored Brain values for the
    last three calendar years (or last 36 months) on the user's Zielregionen.
    `coverage` is `single` when only one period is present — that is not a
    trend. Missing periods are `absent` (liegt nicht vor).
    `0.9.0` maps the remaining Brain multi-year themes (`destatis_wohnungen`,
    `destatis_kfz_bestand`, `destatis_bevoelkerung_alter`, `kba_elektro_pkw`,
    `ba_sgb2`, `kba_neuzulassungen`, `kba_bestand`, `unfallatlas_gebiet`) onto
    `yearlySeries`, prefers the most local Unfallatlas Gebiet key, uses
    Berlin Regionalstatistik Bezirk AGS8 (`11007007`) when present, strips
    `ref_period` tags after `|`, never filters on embedding, always
    recomputes the field on `GET /analysis/pattern` and new runs, and
    anchors a yearly window to the latest Brain year when that year is still
    within two years of `asOf`. Placeholder KBA Elektro zeros and geo
    identifiers (`ba_schluessel`, `geo_ags`) are never series values. Count
    metrics (dwellings, population, age-band and other person counts, SGB2
    BG/PERS) are whole numbers; rates, shares, and percentages stay
    fractional. An Ortsteil
    or Stadtteil Zielregion still returns the `yearlySeries` array; missing
    local rows fall back to Gemeinde, Kreis, or Land keys and are labeled
    as such. Grain `ags5` / a 5-digit AGS (Köln `05315`) is `kreis` for
    that lookup, never `gemeinde`.
    `0.10.0` lets `GET /analysis/pattern` take optional `geoKey` (the same
    catalog key as `TargetRegion.geoKey`). When set, the newest completed run
    whose snapshot includes that place is returned; `yearlySeries` is limited
    to that Zielregion; `region` names the matched snapshot place for the
    Stand line. No matching run is `404` with a German message, never another
    region's pattern. Without `geoKey` the newest completed run is unchanged.
    Create stays `POST /analysis/runs` (full list snapshot). Marking a
    Zielregion is UI-only.
    `0.11.0` remodels Musteranalyse criteria and `POST /recommendations`
    (Stufe 1). Candidates are Teilflächen inside the Zielregion (Ortsteil,
    Bezirk, PLZ5; Gemeinden when the region is a Kreis), never the
    Zielregion geoKey itself. Pattern criteria come from Bestandstandort
    surroundings (Ortsteil/PLZ plus Gemeinde-/Kreis-Dreijahresreihen), not
    from clipping Brain facts to the Zielregion. Ranking uses the
    three-year trend where a series exists; Stichtag values are labeled
    as Stichtag and are not month-to-month direction. Missing cells stay
    absent (`liegt nicht vor`), never `0`. Address grain is empty in Brain;
    Stage 1 returns areas, not street addresses. `GET /analysis/pattern`
    `yearlySeries` for the marked Zielregion is unchanged (Verlauf).
    `0.12.0` returns only the **finest** hits per Zielregion (Adresse →
    100-m-Raster → Ortsteil → PLZ5 → Bezirk → Gemeinde). Parent/ancestor
    areas are omitted when a finer child exists. Membership prefers
    `geo.geo_ref_zielregion_teil`. Criteria observed only on a coarser
    admin level are `scope: inherited` and do not differentiate siblings.
    `Recommendation.kind` is the Ebene. Admin map coordinates use
    `geom_4326` / `geom_display` (EPSG:4326); `geo.geo_ref_admin.geom`
    is EPSG:3035.
    `0.12.1` scores kleinräumige Brain yearly series at the hit's own
    Ebene. `hamburg_stadtteil_regionalstatistik` feeds Ortsteil / Stadtteil
    (`ortsteil:{id}`, fallback `hamburg_stadtteil:{id}`).
    `muenchen_indikatorenatlas` feeds Stadtbezirk (`bezirk:{id}`) and the
    München Stadt AGS. `berlin_lor_ewr_bevoelkerung` feeds LOR
    (`lor:{RAUMID}`). Local series beat inherited parent series.
    Missing years stay `absent` (no zero-fill). Embedding is not required.
    `0.13.0` corrects the finest→coarse order to Adresse → 100-m-Raster →
    LOR Planungsraum / Köln-Quartier → Ortsteil → PLZ5 → Bezirk → Gemeinde.
    `AreaKind` / `SeriesLevel` add `quartier` and keep `address` and `lor`.
    Berlin 2021 PLR keys are `lor:plr:*` (`lor_version=2021`, ~542,
    outlines in `geo.geo_ref_lor`); 2006 LOR (`lor:{RAUMID}`, 2001–2020)
    is a separate series and is never concatenated with PLR. Prefer PLR
    for Stage-1 when present. Köln Quartiere use `koeln:sq:*` (~570,
    2012–2025) and beat quartier→bezirk `parent_fallback` rows.
    Further kleinräumige themes: `koeln_statistischer_datenkatalog`
    (Ortsteil 86 / Bezirk 9 / Quartier), `leipzig_lis_ortsteil`
    (Ortsteil 29), `duesseldorf_bevoelkerung_stadtteile` (OT 49 / BZ 10),
    `essen_bevoelkerung_stadtteile` (OT 50), `frankfurt_demographie_stadtteile`
    (OT 40, 2010–2024). Official addresses are read from
    `geo.geo_ref_address` (Berlin, Hamburg, NRW) when rows exist; an
    empty or missing table is skipped and finest-only continues. Addresses
    are never invented. Membership prefers `geo.geo_ref_zielregion_teil`.
    `0.14.0` builds the store-surroundings Muster spiegelbildlich on every
    Ebene (Adresse → 100-m-Raster → LOR/Quartier → Ortsteil → PLZ5 →
    Bezirk → Gemeinde; Kreis as `role: frame` only). Zielregion candidates
    are compared to the store pattern of the **same** Ebene. Inherited
    criteria still do not differentiate siblings; the score uses local
    trends of that Ebene only. `RecommendationSet.patternByLevel` exposes
    that Musterprofil (geoKeys, yearlySeries, criteria with
    `scope: local|inherited`) on POST 201 and GET 200. Additive; older
    stored sets may omit the field. `PatternCriterion.scope` is optional.
    `0.15.0` compares **datasets**, not Ebenen. Each store-surrounding
    series is baselined (`per_1000_inhabitants`, `per_km2`, or
    `per_household`) on its own Fläche; the three-year trend uses
    `normalizedValue`, never raw counts. Missing Bezugsgröße is `absent`
    (liegt nicht vor), never `0`. Pattern and score run per `metricId` at
    the finest Fläche where that dataset exists (Berlin Bezirk vs Köln PLZ
    still match relatively). Several datasets yield the smallest common
    hit (intersection of those Flächen). `patternByDataset` is the
    compare profile; `patternByLevel` stays a geography inventory.
    Hierarchy Adresse→…→Gemeinde still chooses Flächen. Additive.
    `0.16.0` takes Bezugsgrößen from Brain `geo.area_baseline` (PK
    `geo_key`, `grain`, `ref_year`) and `geo.baseline_metric_catalog`
    (`source_theme` → `einwohner` / `flaeche_km2` / `haushalte`).
    `baselineMethod` on `SeriesPoint`, `PatternCriterion`,
    `PatternDatasetProfile`, and `RecommendationEvidence` is the method
    of the divisor (`official`, `estimate_lor_sum`, `estimate_address`,
    `missing`, `geom`, `fixed_grid`). `einwohner_method` is never a
    silent NULL; `missing` omits `normalizedValue` and never divides by
    1. Catalog-first per theme. Additive.
    `0.17.0` adds Zensus-2022 Gitter methods on `BaselineMethod`:
    `official_zensus2022_grid` (100m cell EWZ) and
    `estimate_zensus2022_grid_sum` (PLZ/Ortsteil centroid sum). Address
    counts stay `estimate_address` only as fallback; `attrs.preferred_ew`
    selects the Zensus row. `dwd1km` is Fläche-only (`missing` EW).
    Additive.
    `0.18.0` answers the UX Trefferliste contract gaps (Confluence 31227905,
    PO Variante A). `Recommendation.geometry` is the hit outline as GeoJSON
    Polygon/MultiPolygon (EPSG:4326): dataset Fläche(n) clipped to the
    Zielregion (`ST_Intersection`), never a bbox or circle. When the
    outline cannot be computed, `geometry` is null and
    `geometryUnavailableReason` explains why (German). `Recommendation.trend`
    carries `direction` (`up`|`down`|`flat`|`unknown`) and `summary` (German
    Entwicklungssatz) from the backend only — clients must not invent them;
    omit/empty when coverage is `single` or `none`. `SeriesCoverage` adds
    `series` as the preferred label for a multi-period Verlauf (`multi`
    remains valid for older stored sets). Pattern vs candidate Bezugsgröße:
    `baselineMatch` on `RecommendationEvidence` / `PatternDatasetProfile`
    is false when baselines differ — then Muster compares as absent
    („liegt nicht vor“). Additive; no DB migration.
    `0.18.1` binds Treffer to the Musteranalyse run. `POST /analysis/runs`
    stores a recommendation set for the marked Zielregion(en) on that `runId`.
    `GET /recommendations` stays read-only: optional `runId` returns the
    stored set for that run, omit returns the newest set; neither computes.
    Switching Zielregion never starts a run. Additive; no DB migration.
    `0.19.0` closes the remaining Trefferliste gaps. `Recommendation` adds
    official top-level `grain`, `name`, and `parentLabel` (nullable).
    `parentLabel` is the parent area display name (Ortsteil → Bezirk),
    never a key. `location.grain` and `location.name` stay for
    compatibility and are deprecated. `Recommendation.intersectionOf`
    lists the named parts of a Schnittfläche (`geoKey`, `grain`, `name`,
    optional `datasetKey`); empty or omitted when the hit is a single
    Fläche.     `AnalysisRun.status` is the real lifecycle
    `queued` | `running` | `completed` | `failed`. Optional
    `failureReason`, `startedAt`, and `completedAt` are nullable.
    `POST /analysis/runs` answers `202 Accepted` with the full
    `AnalysisRun` (`status` `queued`) and computes in the background.
    Clients poll `GET /analysis/runs/{id}` every ~2 s until
    `completed` or `failed`. Unknown or another user's id is `404`.
    `failureReason` is the closed enum `timeout` | `pattern_failed` |
    `set_save_failed` | `interrupted` | `internal_error` (technical
    detail stays in the server log). The overall run deadline is
    `ANALYSIS_RUN_DEADLINE_MS` (default 120000, below the ~150 s
    gateway and the Web ~3 min polling cap). Switching Zielregion
    never starts a run. Additive; stored `completed` rows stay
    `completed`. Additive; no DB migration.
    `0.19.1` keeps `Recommendation.name` always filled (never null, never a
    catalog key or internal id) with documented fallbacks (`PLZ 80331`,
    `Planungsraum ohne Namen`, `Quartier ohne Namen`, `{Art} ohne Namen`,
    `100-m-Rasterzelle`, Straße + Hausnummer or `Adresse ohne Hausnummer`).
    `parentLabel` is the **Gemeinde** for every Ebene below municipality
    (including PLZ, LOR, Quartier, Raster, Adresse); null on `gemeinde`.
    `intersectionOf` stays the dataset Schnittfläche. Optional `overlaps`
    lists Stadtbezirke/Bezirke that intersect the **clipped** hit
    (`share` 0–1 of the Zielregion-clipped area, drop below 1 %;
    PLZ, LOR, Ortsteil, Raster, Adresse). Additive / tightening; no DB
    migration.
    `0.19.2` ranks **je Zielregion**. `Recommendation.targetRegionGeoKey`
    is the key used for that item: `AnalysisRegion.geoKey` when present,
    otherwise `ags:{ags}`, otherwise `label:{normalized label}` (trim,
    collapse whitespace, lowercase). The set lists that used key per
    Zielregion in additive `RecommendationSet.targetRegions[].geoKey`.
    `rank` is 1-based and gapless inside that key, all Ebenen together
    by score descending. The same Fläche in two Zielregionen is two items
    (`id` is `{grain}:{geoKey}@{targetRegionGeoKey}`), each with geometry,
    overlaps, and share clipped to that region. `dataAsOf` is the newest
    `criteriaEvidence.points[].period` (`YYYY` or `YYYY-MM`) used for the
    item, or null when no point exists. The Musterverlauf stays on the
    set: clients join `criteriaEvidence[].metricId` to
    `patternByDataset[].yearlySeries`. Ranked `items` are capped at 200
    with a guaranteed quota per Zielregion: n ≤ 66 → at least 3 slots;
    67–200 → at least 1 (`floor(200/n)`). More than 200 Zielregionen is
    rejected (`POST /analysis/runs` 400). `POST /target-region` has no
    separate per-user count limit. Additive; stored as JSON on
    `recommendation_sets.payload` — no DB migration.
    `0.19.3` lets `POST /analysis/runs` take optional
    `markedTargetRegionGeoKey` (the marked Zielregion catalog key).
    The web client already sends `{ geoKey }` and `?geoKey=`; both are
    accepted aliases (`markedTargetRegionGeoKey` wins when both body
    fields are set). When set, that place becomes `input.region` while
    `input.regions` stays the full list of the token user. Omit the
    field to keep the previous behaviour (newest saved Zielregion as
    `input.region`). An unknown or foreign key is `404` with `code`
    `marked_target_region_not_found`. `GET /analysis/pattern` and
    `GET /analysis/runs/{id}` read stored `yearlySeries`; they rebuild
    only when the stored pattern omitted the field. LOR / address /
    raster / Quartier candidates for Ortsteil Zielregionen use
    `ST_Intersects` / `geo_ref_zielregion_teil`, never Gemeinde-AGS
    `11000000` from `parentLabel`. `geometryUnavailableReason` is set
    only when `geometry` is null. Additive; no DB migration.
    `0.19.4` replaces the binary hit score (`matched / localTrend.length`)
    with closeness to the store-surroundings Musterwert on the shared
    baseline. Per dataset: proximity = 1 − min(1, |Kandidat − Muster| /
    robuste Streuung); Streuung is MAD (IQR fallback) over local
    candidate values of that dataset and Ebene. Fewer than 3 values or
    Streuung 0 → the dataset is neutral (omitted, never divide by 0).
    Inherited series are therefore neutral. Trend weight 0.6 / niveau
    0.4 (`ANALYSIS_SCORE_TREND_WEIGHT` /
    `ANALYSIS_SCORE_NIVEAU_WEIGHT`); coverage `single` is not a trend
    (needs ≥2 years). Trend is the yearly rate
    (last−first present `normalizedValue`) / year span so gaps do not
    inflate the delta. Additive `criteriaEvidence.trendYears` is the
    distinct calendar-year count (2 = two-year trend). Grain weights
    prefer the finer Ebene the dataset is present on (Adresse/Raster >
    LOR/Quartier > Ortsteil/PLZ > Bezirk > Gemeinde). Coverage factor:
    score × min(1, nAktiv / `ANALYSIS_SCORE_MIN_ACTIVE_DATASETS`,
    default 2) so one dataset never yields 1.0. Missing cells stay
    `absent`, never `0`. `RecommendationEvidence.proximity` is the
    optional per-dataset closeness (0..1). Tie-break: coverage, then
    `overlaps[].share`, then stable `id` — never the visible name.
    Polygon candidates (not points, addresses, raster, or
    `geo_ref_zielregion_teil` children) need
    `ST_Area(intersection)/ST_Area(candidate)` in EPSG:3035 ≥
    `ANALYSIS_MIN_OVERLAP_SHARE` (default 0.10) before the spatial
    LIMIT, so edge fragments are not hits. Additive; no DB
    migration.
    `0.19.5` keeps the 0.19.4 closeness score and adds the Tempelhof
    ranking and overlaps fixes. Robust scale is σ ≈ 1.4826·MAD, else
    IQR/1.349. Candidates without local dataset hits drop when siblings
    have local data. Areas with only inherited or Stichtag values stay
    in `items` with score 0 and are ordered by share in the Zielregion,
    then stable `id`. Empty `items` uses the existing empty-region
    reason only when no Teilfläche exists.
    Tie-break after score and nAktiv is the share of the **unclipped**
    candidate inside the Zielregion (`items[].overlaps[]` with
    `isTargetRegion: true`, else loaded `targetOverlapShare`), then
    stable `id` — never the visible name and never a Bezirk share of a
    clipped fragment. Additive `criteriaEvidence.trendFromTwoYears` is
    true when `trendYears` is 2 (Web: „Trend aus 2 Jahren“ from
    `items[].criteriaEvidence[].trendYears` /
    `items[].criteriaEvidence[].trendFromTwoYears`). `overlaps` lists
    the Zielregion first (`isTargetRegion: true`, share = candidate ∩
    Zielregion / candidate area in EPSG:3035) and then Ortsteile of the
    unclipped candidate; `label` is never a geo-key. Additive; no DB
    migration.
    `0.19.6` adds optional `items[].localDatasetCount` (nAktiv): the
    number of local datasets with a numeric `criteriaEvidence[].proximity`
    (`0` is a valid closeness and counts). `0` means inherited/Stichtag
    only. Omitted on older stored sets. Additive; no DB migration.

    Analysis (0.3.0) snapshots that input, reads kleinräumige Brain facts for
    the target region, and persists a pattern (criteria and direction).
    Recommendations (0.12.0) rank the finest Teilflächen inside that
    region against the store-surroundings pattern over three calendar
    years, and attach a German rationale per area.

    Map (0.5.0) keeps store pins and the target-region overlay on this API.
    Store `lon`/`lat` are WGS84. Clients are not required to send them.
    KAN-56 Option A: when a write omits both, the API looks up Data-Scout
    `geo_ref_address` (street and house number plus PLZ). The PLZ5 centroid
    (`geo_ref_plz`, then `app.search_places` or a Point in `app.map_features`)
    is used only when that address misses. If the client sends both `lon` and
    `lat`, that pair is stored as sent. No public geocoder is called.
    Each saved target region has `bounds` (west, south, east, north) for map
    fitBounds together with store pins, and `geometry` (GeoJSON Polygon or
    MultiPolygon, EPSG:4326, longitude then latitude) for a semi-transparent
    fill and outline. Labels stay client-side. Clients call only this API.
servers:
  - url: http://localhost:3000
    description: Local development. The host and port follow the backend `PORT` env (default 3000).
tags:
  - name: Health
  - name: Auth
  - name: Search
  - name: Layers
  - name: TargetRegion
  - name: Stores
  - name: Analysis
  - name: Recommendations
  - name: AddressPair
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness
      description: Process is up. This check does not query Postgres.
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Exchange email and password for a JWT
      description: |
        Returns a bearer token. Local databases seeded by `db/migrations`
        include `dev@ruehrai.local` / `dev-password`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
            example:
              email: dev@ruehrai.local
              password: dev-password
      responses:
        "200":
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Unknown email or wrong password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: |
            The database connection failed after a short retry. The credentials
            were not rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Create a user and return a JWT
      description: |
        Password hashing is done in Postgres (`pgcrypto` bcrypt) and the row is
        stored in `app.users`. Minimum password length is 8. The response matches
        `POST /auth/login`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: User created and signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email is already registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: |
            The database connection failed after a short retry. The body was
            not rejected and the email was not reported as a duplicate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Current user
      description: "Requires Authorization: Bearer <accessToken>."
      responses:
        "200":
          description: User row for the token subject.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current access token
      description: |
        Requires `Authorization: Bearer <accessToken>`. Stores the token id
        (`jti`) in `app.revoked_tokens` until the token's own expiry. A later
        request with the same token is `401`. Clients should also drop the
        token locally. This is the Slice-1 session end: JWTs stay stateless
        apart from this denylist. There is no refresh token.
      responses:
        "204":
          description: Token revoked. The body is empty.
        "400":
          description: The token has no revocable id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /target-region:
    get:
      tags: [TargetRegion]
      operationId: listTargetRegions
      summary: List the signed-in user's target regions
      description: |
        The saved set used for the location search. Newest add first.
        An empty list is `200` with `items: []`, not `404`.

        Each item keeps the fields clients already show for a catalog hit:
        place name (`label`), `level`, and `parentLabel`. `geoKey` stays in
        the JSON so a later add or remove can name the place. Nothing in this
        API requires a client to display that key.

        `level` is the catalog token: `plz`; `bezirk` only for Berlin
        `11000001`–`11000012`; `stadtbezirk` for every other Bezirk;
        `stadtteil` or `ortsteil` from the catalog kind; `gemeinde` for a
        municipality (grain `ags`, such as München `09162000`). Never
        `gemeinde` for a sub-area. `parentLabel` is the parent municipality
        name, not a second name for the area. Empty when the catalog has no
        parent (München has none).
      responses:
        "200":
          description: Saved target regions, possibly none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetRegionList"
              example:
                items:
                  - label: Lankwitz
                    grain: other
                    geoKey: "ortsteil:osm:5712247"
                    level: ortsteil
                    parentLabel: Berlin
                    lon: 13.34
                    lat: 52.43
                    updatedAt: "2026-10-03T12:00:00.000Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [TargetRegion]
      operationId: addTargetRegion
      summary: Add a catalog place to the target-region list
      description: |
        Appends one place. Existing items stay. The new item is first on the
        next `GET`. This is not an overwrite of the whole list. There is no
        `PUT /target-region` that replaces the only row.

        Name the place with `geoKey`, `ags`, or `plz` from `GET /search`.
        Exact `geoKey` / `ags` / `plz` lookup still reloads a stored place
        on search; this write uses that same id. A historical Berlin Bezirk
        alias `11` + nnn + nnn is stored as official `1100000N`.

        A successful add always persists non-null `geometry` and `bounds`
        copied from the catalog MultiPolygon (Brain `geo`, then a non-stub
        `app.map_features` row, then Data-Scout). A GeoJSON Polygon or
        MultiPolygon on the request is stored instead. `bounds` without a
        polygon are ignored and do not become a rectangle. Never persist
        null geometry. If the catalog has no outline, the add is `400` and
        the list is unchanged. A municipality that simply has no sub-area
        is not an error; it can be added when it has an outline.

        The same catalog key appears at most once. A second add of that key
        returns the stored item and does not insert another row.

        `label`, `level`, and `parentLabel` are stored from the catalog hit
        when present. A municipality is returned as `level` `gemeinde`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetRegionWrite"
            example:
              label: München
              grain: ags
              geoKey: "09162000"
              ags: "09162000"
              lon: 11.5755
              lat: 48.1374
      responses:
        "201":
          description: Place added to the list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetRegion"
        "200":
          description: Place was already in the list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetRegion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [TargetRegion]
      operationId: clearTargetRegions
      summary: Clear the target-region list
      description: Idempotent. Responds `204` even when the list was empty.
      responses:
        "204":
          description: List cleared. The body is empty.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /target-region/{geoKey}:
    parameters:
      - $ref: "#/components/parameters/TargetRegionGeoKey"
    delete:
      tags: [TargetRegion]
      operationId: removeTargetRegion
      summary: Remove one place from the target-region list
      description: |
        Deletes the item whose stored catalog key matches `geoKey` after the
        same Berlin-alias rewrite as add. Idempotent: `204` when the key is
        not in the list. Other items stay.
      responses:
        "204":
          description: Place removed, or it was not in the list. The body is empty.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /stores:
    get:
      tags: [Stores]
      operationId: listStores
      summary: List the signed-in user's store addresses
      description: |
        A read persists `lon`/`lat` when the stored pair is null, or when an
        address match in Data-Scout replaces a pin that still sits on a PLZ
        centroid. An explicit pair is returned unchanged. Resolution order is
        the same as create.
      responses:
        "200":
          description: Stores owned by the token's user, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Stores]
      operationId: createStore
      summary: Add a store address
      description: |
        German address (`postalCode` is PLZ5, `countryCode` is `DE`).
        `street` includes the house number. `lon` and `lat` are optional WGS84
        (EPSG:4326) for the map pin. Clients are not required to send them.
        Send both or neither. KAN-56 Option A, when both are omitted:

        1. Data-Scout `geo_ref_address` (`strasse` + `hnr` parsed from `street`,
           plus `plz`). Berlin OSM coverage. This is the house-number pin.
        2. Data-Scout `geo_ref_plz` centroid, only when step 1 misses.
        3. PLZ centroid from `app.search_places`, then a Point in
           `app.map_features` with that PLZ, only when steps 1 and 2 miss.

        Steps 1 and 2 run only when `DATASCOUT_DATABASE_URL` is set and the
        read succeeds. Otherwise the API uses step 3. Coordinates stay null
        only when none of the steps hit. No public geocoder is called.
        Update uses the same order. A pair sent by the client is stored
        unchanged; it is an optional override, not the primary source.
        A read persists a filled null pair, and replaces a stored PLZ centroid
        when step 1 hits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreLocationWrite"
            example:
              label: Filiale Marienplatz
              street: Marienplatz 1
              postalCode: "80331"
              city: München
      responses:
        "201":
          description: Store created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreLocation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /stores/{id}:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      tags: [Stores]
      operationId: getStore
      summary: Read one store address
      description: "404 when the id is missing or belongs to another user."
      responses:
        "200":
          description: Store owned by the token's user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreLocation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No store with this id for the token's user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [Stores]
      operationId: updateStore
      summary: Replace a store address
      description: |
        Same coordinate rule as create. Omit `lon` and `lat` together to
        resolve Data-Scout `geo_ref_address`, then `geo_ref_plz`, then the
        `app.search_places` / `app.map_features` PLZ stub. Send both to keep
        an explicit WGS84 pin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreLocationWrite"
      responses:
        "200":
          description: Updated store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreLocation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No store with this id for the token's user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Stores]
      operationId: deleteStore
      summary: Delete a store address
      description: Also deletes monthly revenue for that store.
      responses:
        "204":
          description: Store deleted. The body is empty.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No store with this id for the token's user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stores/{id}/revenue:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      tags: [Stores]
      operationId: listStoreRevenue
      summary: Monthly revenue for one store
      description: |
        Points the customer has saved, ordered by year then month. A point with
        `revenueEur: null` was explicitly marked missing. A month with no point
        was not entered. At most 36 points are stored per store.
      responses:
        "200":
          description: Saved months. Empty `points` when none have been entered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyRevenueSeries"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No store with this id for the token's user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [Stores]
      operationId: putStoreRevenue
      summary: Upsert monthly revenue points
      description: |
        Inserts or replaces each `(year, month)` in the body. Other saved months
        stay. `revenueEur: null` marks that month as missing. The store can hold
        at most 36 months; a request that would exceed that returns `400` and
        changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonthlyRevenueWrite"
            example:
              points:
                - year: 2025
                  month: 1
                  revenueEur: 18450.5
                - year: 2025
                  month: 2
                  revenueEur: null
      responses:
        "200":
          description: Full series after the upsert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyRevenueSeries"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No store with this id for the token's user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stores/{id}/revenue/{year}/{month}:
    delete:
      tags: [Stores]
      operationId: deleteStoreRevenueMonth
      summary: Remove one monthly revenue point
      description: |
        `204` when the store exists, including when that month was not stored.
        `404` when the store is missing or belongs to another user.
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - name: year
          in: path
          required: true
          schema:
            type: integer
            minimum: 1990
            maximum: 2100
        - name: month
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        "204":
          description: Month removed, or it was not stored. The body is empty.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No store with this id for the token's user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /search:
    get:
      tags: [Search]
      operationId: searchPlaces
      summary: Search places by name, grain, or geo key
      description: |
        Reads Brain `geo` (PLZ, Stadtbezirk, Stadtteil, Ortsteil) together with
        `features.v_location_search` when that view contains at least one row.
        Free-text `q` matches the place name and, for catalog rows, `parentLabel`.
        It does not match internal catalog keys (`id`, `geo_key`, `geo_ags`) such
        as `plz5:12247`, `ortsteil:osm:…`, `stadtteil:osm:…`,
        `stadtbezirk:osm:…`, or `ags:…`. Typing one of those keys as `q` returns
        no hit. `lon` and `lat` are JSON null when the row has no coordinates.
        A row without a name is omitted; `label` is never empty.

        `q` is a substring of visible text. `type` limits `q` to grain `ags`,
        `plz5`/`plz8`, or `address`. Without `type`, `q` matches name and title
        (and catalog `parentLabel`). `type` has no effect when `q` is omitted.
        PLZ hits (`level=plz`, or grain `plz5`/`plz8`) appear only when the
        whole `q` is digits, for example `12247` or `80331`. A name query such
        as München, Hamburg, or Leipzig never returns PLZ rows. Ortsteil,
        Stadtteil, Stadtbezirk, and Bezirk still match a name query.

        `ags` and `plz` are exact geo_key matches on that grain. `geoKey` is an
        exact geo_key or catalog `id` match on any grain (reload of a stored
        place). `grain` is exact. `address` is a substring of name and title.
        Filters combine with AND.
        At most 50 hits, ordered by exact id/label match, then label.

        If the view is missing or has no rows (local docker-compose), the same
        filters run against the seeded `app.search_places` catalog and are
        merged with `geo` hits. Coordinates are WGS84 (EPSG:4326) when present.
        Rows with null or empty `geom` never appear. Berlin districts already
        in the seed or the view are not listed twice.

        A hit is a place id (`id`, `geoKey`, `grain`), not a polygon. Catalog
        hits also send `level` and `parentLabel` (and `geoAgs` when `geo_ags`
        is set). A municipality hit sends `level` `gemeinde` instead of
        omitting it. The Zielregion picker sends that id to `POST /target-region`
        without `geometry`. The write looks up a MultiPolygon in Brain `geo`,
        then a non-stub `app.map_features` row, then Data-Scout
        `geo_ref_bezirk` or `geo_ref_admin`. Search rows and Point features
        are not outlines. A Berlin Bezirk alias (`11006006`, `11007007`, and
        the same `11` + nnn + nnn pattern) is stored as official `1100000N`.
        A hit with no catalog polygon is rejected. Bounds or a point are not
        turned into a rectangle. One hit per geo key. The same display name
        may appear twice only when `parentLabel` differs.
      parameters:
        - name: q
          in: query
          required: false
          description: |
            Free-text substring of the place name and parent municipality.
            Does not match catalog keys. PLZ hits require `q` to be only digits.
          schema:
            type: string
            maxLength: 200
        - name: type
          in: query
          required: false
          description: Field that `q` is matched against. Ignored when `q` is absent.
          schema:
            $ref: "#/components/schemas/SearchType"
        - name: address
          in: query
          required: false
          description: Substring matched against the address and the label.
          schema:
            type: string
            maxLength: 300
        - name: ags
          in: query
          required: false
          description: Exact Amtlicher Gemeindeschlüssel (2–8 digits).
          schema:
            type: string
            pattern: "^[0-9]{2,8}$"
        - name: plz
          in: query
          required: false
          description: Exact PLZ5 or PLZ8.
          schema:
            type: string
            pattern: "^[0-9]{5}([0-9]{3})?$"
        - name: geoKey
          in: query
          required: false
          description: Exact geo_key or catalog id. Reloads a stored place; not free-text.
          schema:
            type: string
            maxLength: 200
        - name: grain
          in: query
          required: false
          description: Exact spatial grain.
          schema:
            $ref: "#/components/schemas/Grain"
      responses:
        "200":
          description: Matching hits, at most 50, ordered by label.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
              example:
                hits:
                  - id: "1"
                    label: München
                    grain: ags
                    geoKey: "09162000"
                    lon: null
                    lat: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /layers/{id}:
    get:
      tags: [Layers]
      operationId: getLayer
      summary: GeoJSON FeatureCollection for a layer
      description: |
        Returns a GeoJSON FeatureCollection as `application/json`.
        Layer rows stay in schema `app` (`map_layers`, `map_features`) until
        feature documents have coordinates. Seeded layer ids in local dev:
        `demo-gemeinden`, `demo-plz`, `demo-grid100`.
        `demo-gemeinden` has no features.
        `demo-plz` and `demo-grid100` stay synthetic points.
        Coordinates are WGS84 (EPSG:4326), longitude then latitude.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
          example: demo-gemeinden
      responses:
        "200":
          description: Layer contents. An existing layer with no features returns an empty `features` array.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureCollection"
              example:
                type: FeatureCollection
                name: Demo-Gemeinden
                description: Synthetische Demo-Geometrien.
                features:
                  - type: Feature
                    id: ags:11000000
                    geometry:
                      type: Point
                      coordinates: [13.405, 52.52]
                    properties:
                      label: Berlin
                      grain: ags
                      ags: "11000000"
                      stub: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No layer with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /analysis/input:
    get:
      tags: [Analysis]
      operationId: getAnalysisInput
      summary: Structured analysis input for the signed-in user
      description: |
        Builds the Musteranalyse input from the user's saved target region,
        store addresses, and monthly revenue (at most 36 months per store).
        A revenue change counts only between two successive calendar months
        that both have a non-null amount. `404` when no target region is
        saved. `400` when no store has two adjacent months with revenue.
      responses:
        "200":
          description: Input that a run would snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisInput"
        "400":
          description: Region exists, but monthly revenue is not sufficient.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 400
                message: Die Monatsumsätze reichen für eine Musteranalyse nicht aus. Mindestens eine Filiale braucht zwei aufeinanderfolgende Monate mit gesetztem Umsatz.
                error: Bad Request
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: This user has not saved a target region.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 404
                message: Keine Zielregion gespeichert. Bitte zuerst eine Zielregion anlegen.
                error: Not Found
  /analysis/runs:
    post:
      tags: [Analysis]
      operationId: createAnalysisRun
      summary: Snapshot input, enqueue Brain search, and persist a pattern
      description: |
        Same preconditions as `GET /analysis/input`. The call answers
        `202 Accepted` with the full `AnalysisRun` (`status` `queued`)
        and the same schema as `GET /analysis/runs/{id}`. Computation
        continues in the background (`running`, then `completed` after
        the recommendation set is stored, or `failed`). Clients poll
        `GET /analysis/runs/{id}` every ~2 s until `completed` or
        `failed`. The overall deadline is `ANALYSIS_RUN_DEADLINE_MS`
        (default 120000). When Zielregion(en) are marked, a
        recommendation set for those regions is stored and bound to
        this `runId`. `GET /recommendations` never computes a set.
        Marking another Zielregion later does not start a run. Failed
        runs keep `failureReason` (closed enum) and stay readable on
        `GET /analysis/runs/{id}`. Optional body field
        `markedTargetRegionGeoKey` (or the web alias `geoKey` in the
        JSON body / `?geoKey=`) selects which saved Zielregion
        becomes `input.region` (the full list stays in
        `input.regions`). Omit it to keep the previous behaviour
        (newest saved Zielregion). Unknown or foreign keys are `404`
        with `code` `marked_target_region_not_found`.
      parameters:
        - $ref: "#/components/parameters/AnalysisRunCreateGeoKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisRunCreate"
      responses:
        "202":
          description: |
            Accepted. Body is the full `AnalysisRun` with `status`
            `queued`. Poll `GET /analysis/runs/{id}` every ~2 s.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisRun"
        "400":
          description: |
            Monthly revenue is not sufficient for a pattern, or the
            snapshot has more than 200 Zielregionen (ranking quota
            cannot cover every region inside `items` maxItems 200;
            no region is dropped silently).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            This user has not saved a target region, or
            `markedTargetRegionGeoKey` is unknown or belongs to
            another user. The latter uses `code`
            `marked_target_region_not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /analysis/runs/{id}:
    get:
      tags: [Analysis]
      operationId: getAnalysisRun
      summary: Read one analysis run of the signed-in user
      description: |
        Returns the full `AnalysisRun` (`id`, `status`
        `queued` | `running` | `completed` | `failed`, optional
        `failureReason`, `startedAt`, `completedAt`, plus input, Brain,
        and pattern). Stored `yearlySeries` are returned as persisted;
        they are rebuilt only when the stored pattern omitted the field.
        Clients poll this path every ~2 s after
        `POST /analysis/runs` until `completed` or `failed`. Unknown
        ids and another user's runs are `404`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[1-9][0-9]{0,18}$"
          description: Run id as a decimal string.
      responses:
        "200":
          description: The run, including input, Brain facts, and pattern.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No run with this id for the token's user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 404
                message: Die Analyse wurde nicht gefunden.
                error: Not Found
  /analysis/pattern:
    get:
      tags: [Analysis]
      operationId: getAnalysisPattern
      summary: Latest persisted pattern for the signed-in user
      description: |
        Without `geoKey`, returns the pattern from the newest completed run
        (`input.region` is the Stand-line place). With `geoKey`, returns the
        newest completed run whose snapshot includes that catalog key
        (`input.region.geoKey` or any `input.regions[].geoKey`), after the
        same Berlin Bezirk alias rewrite as add/remove on `/target-region`.
        `yearlySeries` is then limited to that Zielregion. Criteria and
        summary stay as stored. Stored `yearlySeries` are returned as
        persisted; they are rebuilt only when the stored pattern omitted
        the field. `404` when this user has no matching run —
        never another region's pattern. This endpoint does not start a run.
      parameters:
        - $ref: "#/components/parameters/AnalysisPatternGeoKey"
      responses:
        "200":
          description: Pattern for the latest matching completed run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisPatternResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            No completed analysis run for this user, or `geoKey` did not
            match any of this user's completed snapshots.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                noPattern:
                  summary: No completed run
                  value:
                    statusCode: 404
                    message: Es liegt noch kein Muster vor. Bitte zuerst eine Analyse starten.
                    error: Not Found
                noRunForRegion:
                  summary: geoKey set, no matching snapshot
                  value:
                    statusCode: 404
                    message: Für diese Zielregion liegt noch kein Analyselauf vor.
                    error: Not Found
  /recommendations:
    post:
      tags: [Recommendations]
      operationId: createRecommendations
      summary: Rank Teilflächen inside the Zielregion
      description: |
        Reads a completed Musteranalyse for this user (the newest run, or
        `runId` when set) and rebuilds pattern criteria from the
        Bestandstandort surroundings (Ortsteil/PLZ near each store plus
        three-year Gemeinde-/Kreis series). It then lists only the
        **finest** Teilflächen inside the Zielregion (never the region
        itself), evaluating small → large:

        - Adresse (`kind=address`) from `geo.geo_ref_address` when rows
          exist for the Zielregion (Berlin, Hamburg, NRW). Empty or
          missing table is skipped; addresses are never invented.
        - 100-m Raster (`grid100` / `breitband_gitter`)
        - LOR Planungsraum 2021 (`lor:plr:*` / `geo.geo_ref_lor`) and
          Köln-Quartier (`koeln:sq:*`, `kind=quartier`). Finer than Ortsteil.
          2006 LOR (`lor:{RAUMID}`) is a separate series, used only when
          no PLR exists, never concatenated with 2021.
        - Ortsteil / Stadtteil (`geo.geo_ref_ortsteil`; Hamburg also
          `hamburg_stadtteil:{id}` yearly series)
        - PLZ5 (`geo.geo_ref_plz`)
        - Stadtbezirk / Bezirk (`geo.geo_ref_bezirk`; München
          `muenchen_indikatorenatlas` on `bezirk:{id}`)
        - Gemeinde (`geo.geo_ref_admin`) when no finer child exists

        Parent→child membership prefers `geo.geo_ref_zielregion_teil`
        (`within` / `partial`). Geometry fallback uses
        `app.target_regions.geometry` and `geom_4326` / `geom_display`
        on admin rows (`geom` is EPSG:3035, not WGS84).

        A parent/ancestor is omitted when a finer child matches.
        `items[].kind` is the Ebene. Criteria available only on a coarser
        admin level have `criteriaEvidence[].scope: inherited` and do not
        differentiate sibling Teilflächen. `scope: local` is native to
        that hit.

        Ranking uses closeness to the store-surroundings Musterwert on
        the baseline (`0.19.4`): trend before niveau, robust spread
        (MAD/IQR) per dataset and Ebene, inherited and under-dispersed
        series neutral, coverage factor so one dataset never yields
        1.0. Trend is a yearly rate (delta / year span). Snapshot values
        are labeled `stichtag`. Missing cells are
        `absent` (`liegt nicht vor`), never `0`. Kleinräumige
        yearlySeries rows may have a null embedding. Candidates without
        local dataset hits drop when siblings have local data; areas
        with only inherited or Stichtag values stay with score 0 and
        are ordered by share in the Zielregion, then `id`. Additive
        `criteriaEvidence[].proximity` is the per-dataset closeness;
        `trendYears` is the calendar-year count of a trend;
        `trendFromTwoYears` is true when that count is 2.
        Polygon candidates require `ANALYSIS_MIN_OVERLAP_SHARE`
        (default 0.10) of their area inside the Zielregion.
        `items[].overlaps[0]` is the Zielregion (`isTargetRegion: true`)
        with the unclipped candidate share; further entries are Ortsteile.
        Additive `items[].localDatasetCount` (0.19.6) is nAktiv: how many
        local datasets have numeric `proximity` (`0` counts). `0` =
        inherited/Stichtag only. Omitted on older stored sets.

        `rank` is 1-based and gapless **je Zielregion**
        (`items[].targetRegionGeoKey`), all Ebenen together by score
        descending. A Fläche that intersects two Zielregionen appears
        once per region (own `id`, own clipped `geometry` / `overlaps`).
        Clients show the Musterverlauf by joining
        `criteriaEvidence[].metricId` to `patternByDataset[].yearlySeries`;
        it is not copied onto the item.

        An empty `items` array is success only when no sub-area exists
        inside the region (`reason` explains that). `404` when this user
        has no completed pattern, or when `runId` is not one of their runs.

        Each item's `rationale` is German and grounded in
        `criteriaEvidence`. `source` is `llm` when that text came from the
        local model, otherwise `heuristic`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendationCreate"
      responses:
        "201":
          description: Persisted recommendation set for this user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationSet"
              example:
                id: "3"
                runId: "15"
                createdAt: "2026-09-29T12:00:00.000Z"
                window:
                  from: "2023"
                  to: "2025"
                count: 1
                reason: null
                targetRegions:
                  - geoKey: "09162000"
                    label: München
                pattern:
                  source: heuristic
                  summary: Unfälle fallen in der Filialumgebung im Dreijahresverlauf.
                  revenueDirection: up
                  criteria:
                    - key: unfallatlas
                      label: Unfälle (Ortsteil)
                      direction: down
                      kind: trend
                      coverage: multi
                      evidence: "Unfälle fällt im Dreijahresverlauf (2023: 20; 2025: 8)."
                items:
                  - id: "other:ortsteil:osm:5712247@09162000"
                    rank: 1
                    title: Schwabing-West
                    kind: ortsteil
                    targetRegionGeoKey: "09162000"
                    dataAsOf: "2025"
                    location:
                      geoKey: "ortsteil:osm:5712247"
                      grain: other
                      lon: 11.58
                      lat: 48.16
                      name: Schwabing-West
                    score: 1
                    rationale: "Die Teilfläche Schwabing-West (ortsteil:osm:5712247) im Vergleich zum Filialmuster. Quelle: Heuristik, ohne Sprachmodell."
                    criteriaEvidence:
                      - key: unfallatlas
                        label: Unfälle (Ortsteil)
                        direction: down
                        patternDirection: down
                        kind: trend
                        status: present
                        match: true
                        scope: local
                        coverage: multi
                        evidence: "Unfälle fällt im Dreijahresverlauf (2023: 20; 2025: 8)."
                        points:
                          - period: "2023"
                            status: present
                            value: 20
                          - period: "2024"
                            status: absent
                          - period: "2025"
                            status: present
                            value: 8
                    source: heuristic
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No completed analysis pattern for this user, or the run id is not theirs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                noPattern:
                  summary: No completed analysis yet
                  value:
                    statusCode: 404
                    message: Es liegt noch kein Muster vor. Bitte zuerst eine Analyse starten.
                    error: Not Found
                unknownRun:
                  summary: runId is missing for this user
                  value:
                    statusCode: 404
                    message: Die Analyse wurde nicht gefunden.
                    error: Not Found
    get:
      tags: [Recommendations]
      operationId: getRecommendations
      summary: Stored recommendation set for the signed-in user
      description: |
        Read-only. Never ranks or inserts a set. Optional `runId` returns the
        newest stored set bound to that analysis run of the token user.
        Omit `runId` to return the newest set of this user. `404` when no
        matching stored set exists. Computing happens only on
        `POST /analysis/runs` (for the marked Zielregion at that time) or
        `POST /recommendations`.
      parameters:
        - $ref: "#/components/parameters/RecommendationsRunId"
      responses:
        "200":
          description: Latest recommendation set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationSet"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: This user has no stored recommendations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 404
                message: Es liegen noch keine Empfehlungen vor. Bitte zuerst Empfehlungen berechnen.
                error: Not Found
  /address-pair:
    post:
      tags: [AddressPair]
      operationId: evaluateAddressPair
      summary: Compare Brain topics for two addresses
      description: |
        Street and city are labels only. The lookup key is the five-digit
        postal code. Two streets in the same PLZ return the same numbers.

        A side is `resolved` only when that PLZ maps to exactly one
        municipality and exactly one district in Brain `geo.geo_ref_plz` /
        `geo.geo_ref_admin`. Otherwise `resolution` is `unknown`, places are
        null, and `topics` is empty. `land` may be null when no Land row
        exists. Place names are never invented.

        Each resolved side returns the fixed topic lists at Gemeinde, Kreis,
        and Land. `status: present` includes `value` as the stored Brain row.
        `status: absent` omits `value`. Missing rows are never replaced with
        0, null, or `{}`. Pendler, PKS, and Unfallatlas stay separate by
        level. Arbeitsmarkt is Kreis only.

        `shared` lists topics that are present on both sides at the same id
        and level. The handler reads local Brain Postgres only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressPairRequest"
            example:
              left:
                street: Marienplatz 1
                postalCode: "80331"
                city: München
              right:
                street: Alexanderplatz 1
                postalCode: "10178"
                city: Berlin
      responses:
        "200":
          description: Both sides, plus topics present on both.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressPairResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    StoreId:
      name: id
      in: path
      required: true
      description: Store id as a decimal string.
      schema:
        type: string
        pattern: "^[1-9][0-9]{0,18}$"
    TargetRegionGeoKey:
      name: geoKey
      in: path
      required: true
      description: |
        Catalog place id stored on the list item (`geoKey`). Same value
        `GET /search` returns. A Berlin Bezirk alias is matched as the
        official AGS.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    AnalysisPatternGeoKey:
      name: geoKey
      in: query
      required: false
      description: |
        Catalog place id (`TargetRegion.geoKey` / `GET /search`). When set,
        the newest completed run whose snapshot includes this place is
        returned. A Berlin Bezirk alias is matched as the official AGS.
        Omit for the newest completed run of this user.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    AnalysisRunCreateGeoKey:
      name: geoKey
      in: query
      required: false
      description: |
        Same catalog key as `AnalysisRunCreate.geoKey`. The web client
        sends both this query and `{ geoKey }` in the JSON body. Body
        `markedTargetRegionGeoKey` wins when both body fields are set;
        otherwise body `geoKey`, then this query.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    RecommendationsRunId:
      name: runId
      in: query
      required: false
      description: |
        Analysis run id as a decimal string. When set, `GET /recommendations`
        returns the stored set for that run of the token user. The lookup
        never computes or inserts a set. Omit for the newest stored set.
      schema:
        type: string
        pattern: "^[1-9][0-9]{0,18}$"
  responses:
    BadRequest:
      description: Request failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
    TokenResponse:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Token lifetime in seconds.
          example: 28800
    User:
      type: object
      additionalProperties: false
      required: [id, email]
      properties:
        id:
          type: string
          description: User id as a decimal string.
        email:
          type: string
          format: email
    Grain:
      type: string
      description: Spatial grain of a hit. Matches the Datenbasis grain list used by this slice.
      enum: [address, grid100, plz8, plz5, ags, ags5, other]
    SearchType:
      type: string
      enum: [address, ags, plz]
    CatalogLevel:
      type: string
      description: |
        Machine token the web client maps to the badge. Never a German label.
        `plz`, `bezirk`, `stadtbezirk`, `stadtteil`, `ortsteil` are Brain
        `geo` sub-areas. `gemeinde` is a municipality (grain `ags`). Never
        `gemeinde` for a sub-area.
      enum: [plz, bezirk, stadtbezirk, stadtteil, ortsteil, gemeinde]
    SearchHit:
      type: object
      additionalProperties: false
      required: [id, label, grain]
      properties:
        id:
          type: string
        label:
          type: string
        grain:
          $ref: "#/components/schemas/Grain"
        geoKey:
          type: string
          nullable: true
          description: |
            Spatial key from the feature view or the geo catalog (AGS, PLZ,
            Stadtteil/Ortsteil id). Null when unknown. This is the place id
            `POST /target-region` and `DELETE /target-region/{geoKey}` use.
            It is not itself a polygon. Brain `geo` holds PLZ, Bezirk,
            Stadtteil, and Ortsteil outlines. A Berlin Bezirk alias is stored
            as `1100000N`. Free-text `q` does not match this key.
        level:
          allOf:
            - $ref: "#/components/schemas/CatalogLevel"
          nullable: true
          description: |
            Exact tokens:
            `plz` from `geo.geo_ref_plz`;
            `bezirk` only for Berlin `11000001`–`11000012`;
            `stadtbezirk` for every other `geo.geo_ref_bezirk` row;
            `stadtteil` or `ortsteil` from `geo.geo_ref_ortsteil.kind`
            (one of those two words, never both, never `gemeinde`);
            `gemeinde` for a municipality (grain `ags`). Never `gemeinde`
            for a sub-area.
        parentLabel:
          type: string
          nullable: true
          description: |
            Display name of the parent Gemeinde, not a second label for the
            area itself and not a German badge. Distinguishes same-named
            sub-areas. Null when unknown or the hit is the municipality.
        geoAgs:
          type: string
          nullable: true
          description: |
            Parent municipality AGS from the table column `geo_ags`.
            Null when the table has no value.
        lon:
          type: number
          format: double
          nullable: true
          description: WGS84 longitude. Omitted or null when the hit is not geocoded.
        lat:
          type: number
          format: double
          nullable: true
          description: WGS84 latitude. Omitted or null when the hit is not geocoded.
    SearchResponse:
      type: object
      additionalProperties: false
      required: [hits]
      properties:
        hits:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/SearchHit"
    Geometry:
      type: object
      required: [type, coordinates]
      description: GeoJSON geometry. This slice seeds Point and Polygon.
      properties:
        type:
          type: string
          enum: [Point, Polygon, MultiPolygon]
        coordinates:
          description: "GeoJSON coordinates. Position order is longitude, latitude (EPSG:4326)."
      additionalProperties: true
    Feature:
      type: object
      additionalProperties: false
      required: [type, geometry, properties]
      properties:
        type:
          type: string
          enum: [Feature]
        id:
          type: string
        geometry:
          $ref: "#/components/schemas/Geometry"
        properties:
          type: object
          additionalProperties: true
          description: "Includes label, grain, and stub: true for seeded demo features."
    FeatureCollection:
      type: object
      additionalProperties: false
      required: [type, features]
      description: |
        GeoJSON FeatureCollection. `name` and `description` are foreign members
        carried for this API (RFC 7946 allows them).
      properties:
        type:
          type: string
          enum: [FeatureCollection]
        name:
          type: string
        description:
          type: string
        features:
          type: array
          items:
            $ref: "#/components/schemas/Feature"
    LonLatBounds:
      type: object
      additionalProperties: false
      required: [west, south, east, north]
      description: |
        Axis-aligned WGS84 extent for map fitBounds. `west` and `east` are
        longitudes, `south` and `north` are latitudes. Clients union this box
        with store pin coordinates.
      properties:
        west:
          type: number
          format: double
          minimum: -180
          maximum: 180
        south:
          type: number
          format: double
          minimum: -90
          maximum: 90
        east:
          type: number
          format: double
          minimum: -180
          maximum: 180
        north:
          type: number
          format: double
          minimum: -90
          maximum: 90
    RegionGeometry:
      type: object
      additionalProperties: true
      required: [type, coordinates]
      description: |
        GeoJSON Polygon or MultiPolygon for the target-region overlay
        (semi-transparent fill and outline). Position order is longitude,
        latitude (EPSG:4326). Rings are closed. This slice uses the same
        synthetic stubs as `/layers/{id}` when the client does not send one.
      properties:
        type:
          type: string
          enum: [Polygon, MultiPolygon]
        coordinates:
          description: GeoJSON coordinates for the declared type.
    TargetRegion:
      type: object
      additionalProperties: false
      required: [label, bounds, geometry, updatedAt]
      description: |
        One saved place in the user's target-region list. Display fields
        match a search hit: `label`, `level`, `parentLabel`. `geoKey` names
        the place for add and remove.
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 200
          description: Place name. Same field as `SearchHit.label`.
        grain:
          type: string
          nullable: true
          enum: [address, grid100, plz8, plz5, ags, ags5, other]
          description: Same values as Grain. Null when the region is a free-text label.
        geoKey:
          type: string
          nullable: true
          maxLength: 200
          description: |
            Stored catalog key. A Berlin Bezirk alias sent on add is returned
            as the official AGS `1100000N`. Clients use this to remove the
            item. It is not a display field.
        level:
          allOf:
            - $ref: "#/components/schemas/CatalogLevel"
          nullable: true
          description: |
            Same tokens as `SearchHit.level`. `plz`; `bezirk` only for Berlin
            `11000001`–`11000012`; `stadtbezirk` for every other Bezirk;
            `stadtteil` or `ortsteil` from the catalog kind; `gemeinde` for
            a municipality (grain `ags`). Never `gemeinde` for a sub-area.
        parentLabel:
          type: string
          nullable: true
          description: |
            Parent municipality name, same as `SearchHit.parentLabel`. Not a
            second name for the area. Null when unknown or the item is the
            municipality.
        ags:
          type: string
          nullable: true
          pattern: "^[0-9]{2,8}$"
          description: |
            Stored official AGS. Add rewrites `11006006` to `11000006` and
            `11007007` to `11000007`.
        plz:
          type: string
          nullable: true
          pattern: "^[0-9]{5}([0-9]{3})?$"
        lon:
          type: number
          format: double
          nullable: true
          minimum: -180
          maximum: 180
          description: WGS84 longitude of a representative point. Null when unknown.
        lat:
          type: number
          format: double
          nullable: true
          minimum: -90
          maximum: 90
          description: WGS84 latitude of a representative point. Null when unknown.
        bounds:
          nullable: true
          description: |
            Extent of `geometry` for map fitBounds. Null on `GET` only when a
            previously stored region still has no outline and the catalog has
            no point. A successful add always returns bounds.
          allOf:
            - $ref: "#/components/schemas/LonLatBounds"
        geometry:
          nullable: true
          description: |
            Overlay polygon. Null on `GET` only when a previously stored
            region still has no outline and the catalog has none. A successful
            add always returns a Polygon or MultiPolygon.
          allOf:
            - $ref: "#/components/schemas/RegionGeometry"
        updatedAt:
          type: string
          format: date-time
    TargetRegionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          description: |
            Saved places, newest add first. Empty when none are stored.
            No per-user maxItems — ranking of an analysis run accepts at
            most 200 Zielregionen (see `AnalysisInput.regions`).
          items:
            $ref: "#/components/schemas/TargetRegion"
    TargetRegionWrite:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 200
        grain:
          type: string
          nullable: true
          enum: [address, grid100, plz8, plz5, ags, ags5, other]
        geoKey:
          type: string
          nullable: true
          maxLength: 200
          description: |
            Place id. A Berlin Bezirk alias `11` + nnn + nnn is stored as the
            official AGS `1100000N` (an `ags:` prefix is kept).
        ags:
          type: string
          nullable: true
          pattern: "^[0-9]{2,8}$"
          description: |
            Official AGS. Berlin Bezirk aliases such as `11006006` and
            `11007007` are stored as `11000006` and `11000007`.
        plz:
          type: string
          nullable: true
          pattern: "^[0-9]{5}([0-9]{3})?$"
        lon:
          type: number
          format: double
          nullable: true
          minimum: -180
          maximum: 180
        lat:
          type: number
          format: double
          nullable: true
          minimum: -90
          maximum: 90
        bounds:
          nullable: true
          description: |
            Optional extent. Ignored. Bounds on a successful add are derived
            from the stored polygon. Bounds without a polygon do not become
            a rectangle. A successful add always returns non-null `bounds`.
          allOf:
            - $ref: "#/components/schemas/LonLatBounds"
        geometry:
          nullable: true
          description: |
            Optional GeoJSON Polygon or MultiPolygon (EPSG:4326). When set, it
            is the overlay and replaces any catalog outline. A place id from
            `GET /search` is not an outline. A successful add never persists
            null geometry. If this is omitted and the catalog has no polygon,
            the add is `400`.
          allOf:
            - $ref: "#/components/schemas/RegionGeometry"
    StoreLocation:
      type: object
      additionalProperties: false
      required: [id, street, postalCode, city, countryCode, createdAt, updatedAt]
      properties:
        id:
          type: string
          description: Store id as a decimal string.
        label:
          type: string
          nullable: true
          maxLength: 120
          description: Optional store name.
        street:
          type: string
          minLength: 1
          maxLength: 200
          description: Street and house number.
        postalCode:
          type: string
          pattern: "^[0-9]{5}$"
          description: German PLZ5.
        city:
          type: string
          minLength: 1
          maxLength: 120
        countryCode:
          type: string
          enum: [DE]
        lon:
          type: number
          format: double
          nullable: true
          minimum: -180
          maximum: 180
          description: |
            WGS84 longitude for the map pin. Resolved, when a write omits both
            coordinates, from Data-Scout `geo_ref_address`, then `geo_ref_plz`,
            then the PLZ stub in `app.search_places` or `app.map_features`.
        lat:
          type: number
          format: double
          nullable: true
          minimum: -90
          maximum: 90
          description: |
            WGS84 latitude for the map pin. Resolved, when a write omits both
            coordinates, from Data-Scout `geo_ref_address`, then `geo_ref_plz`,
            then the PLZ stub in `app.search_places` or `app.map_features`.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    StoreLocationWrite:
      type: object
      additionalProperties: false
      required: [street, postalCode, city]
      properties:
        label:
          type: string
          nullable: true
          maxLength: 120
        street:
          type: string
          minLength: 1
          maxLength: 200
        postalCode:
          type: string
          pattern: "^[0-9]{5}$"
        city:
          type: string
          minLength: 1
          maxLength: 120
        countryCode:
          type: string
          enum: [DE]
          default: DE
        lon:
          type: number
          format: double
          nullable: true
          minimum: -180
          maximum: 180
          description: |
            WGS84 longitude. Omit together with `lat` to resolve
            `geo_ref_address`, then `geo_ref_plz`, then the PLZ stub.
        lat:
          type: number
          format: double
          nullable: true
          minimum: -90
          maximum: 90
          description: |
            WGS84 latitude. Omit together with `lon` to resolve
            `geo_ref_address`, then `geo_ref_plz`, then the PLZ stub.
    StoreList:
      type: object
      additionalProperties: false
      required: [stores]
      properties:
        stores:
          type: array
          items:
            $ref: "#/components/schemas/StoreLocation"
    MonthlyRevenuePoint:
      type: object
      additionalProperties: false
      required: [year, month, revenueEur, updatedAt]
      properties:
        year:
          type: integer
          minimum: 1990
          maximum: 2100
        month:
          type: integer
          minimum: 1
          maximum: 12
        revenueEur:
          type: number
          format: double
          nullable: true
          minimum: 0
          description: EUR. Null means the month was marked missing.
        updatedAt:
          type: string
          format: date-time
    MonthlyRevenuePointWrite:
      type: object
      additionalProperties: false
      required: [year, month, revenueEur]
      properties:
        year:
          type: integer
          minimum: 1990
          maximum: 2100
        month:
          type: integer
          minimum: 1
          maximum: 12
        revenueEur:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 9999999999.99
    MonthlyRevenueSeries:
      type: object
      additionalProperties: false
      required: [points]
      properties:
        points:
          type: array
          maxItems: 36
          items:
            $ref: "#/components/schemas/MonthlyRevenuePoint"
    MonthlyRevenueWrite:
      type: object
      additionalProperties: false
      required: [points]
      properties:
        points:
          type: array
          minItems: 1
          maxItems: 36
          items:
            $ref: "#/components/schemas/MonthlyRevenuePointWrite"
    AnalysisInput:
      type: object
      additionalProperties: false
      required: [region, stores, revenueDirection, capturedAt]
      description: |
        Snapshot of customer inputs used for Musteranalyse. `regions` is the
        saved target-region list (the set for the location search). `region`
        is the newest item and stays for older snapshots that only stored one
        place. `stores[].points` holds up to 36 months. `changes` links only
        successive calendar months that both have a revenue.
      properties:
        region:
          $ref: "#/components/schemas/TargetRegion"
        regions:
          type: array
          description: |
            Full target-region list at snapshot time, newest first. Location
            search uses this set. Omitted on runs created before the list.
            Ranking accepts at most 200 Zielregionen (`RecommendationSet.items`
            maxItems 200; n ≤ 66 → ≥3 slots each, 67–200 → ≥1). More than
            200 Zielregionen is rejected on `POST /analysis/runs` (400) —
            no region is dropped silently. `POST /target-region` /
            `TargetRegionList` has no separate per-user count limit.
          items:
            $ref: "#/components/schemas/TargetRegion"
        stores:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisStore"
        revenueDirection:
          $ref: "#/components/schemas/RevenueDirection"
        capturedAt:
          type: string
          format: date-time
    AnalysisStore:
      type: object
      additionalProperties: false
      required: [id, street, postalCode, city, points, changes]
      properties:
        id:
          type: string
        label:
          type: string
          nullable: true
        street:
          type: string
        postalCode:
          type: string
          pattern: "^[0-9]{5}$"
        city:
          type: string
        lon:
          type: number
          format: double
          nullable: true
        lat:
          type: number
          format: double
          nullable: true
        points:
          type: array
          maxItems: 36
          items:
            $ref: "#/components/schemas/AnalysisRevenuePoint"
        changes:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisRevenueChange"
    AnalysisRevenuePoint:
      type: object
      additionalProperties: false
      required: [year, month, revenueEur]
      properties:
        year:
          type: integer
          minimum: 1990
          maximum: 2100
        month:
          type: integer
          minimum: 1
          maximum: 12
        revenueEur:
          type: number
          format: double
          nullable: true
          minimum: 0
    AnalysisRevenueChange:
      type: object
      additionalProperties: false
      required: [fromYear, fromMonth, toYear, toMonth, fromRevenueEur, toRevenueEur, changeEur]
      properties:
        fromYear:
          type: integer
        fromMonth:
          type: integer
        toYear:
          type: integer
        toMonth:
          type: integer
        fromRevenueEur:
          type: number
          format: double
        toRevenueEur:
          type: number
          format: double
        changeEur:
          type: number
          format: double
          description: toRevenueEur minus fromRevenueEur, rounded to cents.
    RevenueDirection:
      type: string
      description: Sign of the summed month-to-month revenue changes. Flat means the sum is zero.
      enum: [up, down, flat]
    CriterionDirection:
      type: string
      description: |
        Direction of one Brain criterion. `unknown` means the facts do not
        show a change over time (a Stichtag, or the series is absent).
      enum: [up, down, flat, unknown]
    CriterionKind:
      type: string
      description: |
        `trend` is a multi-year / multi-period series. `stichtag` is a single
        snapshot and must not be treated as month-to-month direction.
      enum: [trend, stichtag]
    AreaKind:
      type: string
      description: |
        Ebene of a Teilfläche inside the Zielregion. Never the region itself.
        Only the finest matching Ebene is returned (Adresse → Raster →
        LOR Planungsraum / Köln-Quartier → Ortsteil → PLZ5 → Bezirk →
        Gemeinde). `address` is skipped when `geo.geo_ref_address` is empty
        or unavailable. `lor` is Berlin LOR Planungsraum (`lor:plr:*`
        preferred; 2006 `lor:{RAUMID}` is separate). `quartier` is Köln
        `koeln:sq:*`.
      enum: [address, grid100, lor, quartier, ortsteil, stadtteil, plz, bezirk, stadtbezirk, gemeinde]
    EvidenceKind:
      type: string
      description: |
        How this criterion was observed on the Teilfläche. `absent` means
        the value liegt nicht vor (never invented as 0).
      enum: [trend, stichtag, absent]
    EvidenceScope:
      type: string
      description: |
        `local` — the value is native to this Teilfläche's Ebene.
        `inherited` — the value comes from a coarser parent (Gemeinde,
        Kreis, …) and is the same for sibling hits; it does not
        differentiate them.
      enum: [local, inherited]
    AnalysisRunStatus:
      type: string
      description: |
        Lifecycle of a Musteranalyse run. `POST /analysis/runs` answers
        `202` with `queued`. The row becomes `running` while Brain,
        pattern, and recommendation-set ranking run, then `completed`
        or `failed`. Clients poll `GET /analysis/runs/{id}` every ~2 s.
        Older stored rows are `completed`.
      enum: [queued, running, completed, failed]
    AnalysisRunFailureReason:
      type: string
      description: |
        Closed reason when `status` is `failed`. Null otherwise.
        `timeout` — overall run deadline (`ANALYSIS_RUN_DEADLINE_MS`,
        default 120000) or a statement timeout. `pattern_failed` —
        Brain search or pattern derivation. `set_save_failed` —
        recommendation-set computation or persist. `interrupted` —
        a `queued`/`running` row still open at process start.
        `internal_error` — anything else. Technical detail stays in
        the server log, never in this field.
      enum: [timeout, pattern_failed, set_save_failed, interrupted, internal_error]
    AnalysisRunCreate:
      type: object
      additionalProperties: false
      description: |
        Optional body for `POST /analysis/runs`. Omit
        `markedTargetRegionGeoKey` (and `geoKey`) to keep the previous
        behaviour (newest saved Zielregion as `input.region`). When
        set, that catalog key must belong to the token user's
        target-region list; it becomes `input.region` while
        `input.regions` stays the full list. Unknown or foreign keys
        are `404` with `code` `marked_target_region_not_found`.
        Additive in 0.19.3.
      properties:
        markedTargetRegionGeoKey:
          type: string
          minLength: 1
          maxLength: 200
          description: Catalog key of the marked Zielregion.
        geoKey:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            Alias of `markedTargetRegionGeoKey`. The signed-in web
            client sends `{ geoKey }` (and `?geoKey=`). Ignored when
            `markedTargetRegionGeoKey` is also set.
    AnalysisRun:
      type: object
      additionalProperties: false
      required: [id, status, createdAt, input, brain, pattern]
      properties:
        id:
          type: string
          description: Run id as a decimal string.
        status:
          $ref: "#/components/schemas/AnalysisRunStatus"
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            When computation started (`running`). Null on a queued row
            that has not started. Completed rows from before 0.19.0 may
            omit this or repeat `createdAt`.
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            When the run finished (`completed` or `failed`). Null while
            queued or running. Older completed rows may omit this.
        failureReason:
          allOf:
            - $ref: "#/components/schemas/AnalysisRunFailureReason"
          nullable: true
          description: |
            Closed enum when `status` is `failed`. Null otherwise.
            Missing values stay null — never a key, German sentence, or `0`.
        input:
          $ref: "#/components/schemas/AnalysisInput"
        brain:
          $ref: "#/components/schemas/AnalysisBrain"
        pattern:
          $ref: "#/components/schemas/AnalysisPattern"
    AnalysisBrain:
      type: object
      additionalProperties: false
      required: [mode, factCount, facts]
      description: |
        Facts retrieved for this run. `vector` means cosine similarity over
        Brain embeddings, filtered to the target region and store postal
        codes. `sql` means the same filters without a vector (embeddings
        unset, unreachable, or not usable). This is not a raw Brain dump.
      properties:
        mode:
          type: string
          enum: [vector, sql]
        vectorUnavailableReason:
          type: string
          nullable: true
          enum:
            - embeddings_disabled
            - embeddings_unconfigured
            - embeddings_unreachable
            - embeddings_rejected
            - vector_query_failed
            - no_embeddings_in_region
            - features_unavailable
          description: |
            Why `mode` is `sql`. Null when `mode` is `vector`.
        factCount:
          type: integer
          minimum: 0
          description: Number of facts included on this run.
        facts:
          type: array
          items:
            $ref: "#/components/schemas/BrainFact"
    BrainFact:
      type: object
      additionalProperties: false
      required: [id, geoKey, grain, title, excerpt, matchedBy, signals]
      properties:
        id:
          type: string
        geoKey:
          type: string
        grain:
          $ref: "#/components/schemas/Grain"
        title:
          type: string
        name:
          type: string
          nullable: true
        refPeriod:
          type: string
          nullable: true
        excerpt:
          type: string
          description: Short prose from the feature document, or the title when no prose is stored.
        distance:
          type: number
          format: double
          nullable: true
          description: Cosine distance when mode is vector. Null for the SQL filter.
        matchedBy:
          type: string
          enum: [region, store, label]
          description: |
            `region` matches the target region ags, plz, or geoKey.
            `store` matches a store postal code.
            `label` is the text fallback when the region has no geo key.
        signals:
          type: array
          maxItems: 6
          items:
            $ref: "#/components/schemas/BrainSignal"
    BrainSignal:
      type: object
      additionalProperties: false
      required: [key, value]
      properties:
        key:
          type: string
        value:
          type: string
          description: |
            Display value for this signal. Count-like metrics (dwellings,
            population, age-band and other person counts, SGB2 BG/PERS, …)
            are whole numbers. Rates, shares, and percentages stay fractional.
    SeriesLevel:
      type: string
      description: |
        Geographic level of a yearlySeries row. `sourceLevel` is the stored
        Brain row. `requestedLevel` is the Zielregion or Teilfläche.
        Grain `ags5` and a 5-digit AGS (Köln `05315`) are `kreis`, never
        `gemeinde`. `grid100` and `address` are Stage-1 hit Ebenen.
        `lor` is Berlin LOR Planungsraum (`lor:plr:*` preferred over 2006
        `lor:{RAUMID}`). `quartier` is Köln `koeln:sq:*`. Both sit finer
        than Ortsteil. Gemeinde or Kreis numbers are never labeled as
        Stadtteil, Ortsteil, PLZ, or Stadtbezirk.
      enum: [address, grid100, lor, quartier, plz, bezirk, stadtbezirk, stadtteil, ortsteil, gemeinde, kreis, land]
    SeriesGranularity:
      type: string
      enum: [month, year]
    SeriesCoverage:
      type: string
      description: |
        How many stored Brain periods exist in the three-year window.
        `none` — every period liegt nicht vor; no line, no Entwicklungssatz.
        `single` — exactly one present point (Stichtag); do not draw a trend
        line and do not invent a direction sentence.
        `series` — two or more present points (Dreijahresverlauf). Preferred
        on new responses from 0.18.0.
        `multi` — same meaning as `series`; kept for older stored sets.
      enum: [none, single, multi, series]
    SeriesPointStatus:
      type: string
      description: |
        `absent` means the period liegt nicht vor. `value` is omitted.
        Never 0, null, or {} as a stand-in. A real stored 0 is `present`.
        Placeholder zeros (KBA Elektro counts of 0 while `pkw_elektro_anteil`
        is positive) are `absent` without `value`.
      enum: [present, absent]
    SeriesPoint:
      type: object
      additionalProperties: false
      required: [period, status]
      properties:
        period:
          type: string
          description: |
            Calendar stamp. `YYYY` when granularity is year, `YYYY-MM` when
            month. Theme suffixes on Brain `ref_period` (`2025-12|bka`) are
            stripped. A quarter such as `2026-Q1` is the year `2026`, not a
            fabricated month.
          pattern: "^[0-9]{4}(-[0-9]{2})?$"
        status:
          $ref: "#/components/schemas/SeriesPointStatus"
        value:
          type: number
          description: |
            Stored Brain cell for this period. Omitted when absent.
            Not a geo identifier (`ba_schluessel`, `geo_ags`, `geo_ags5`,
            `geo_key`, `source_theme`). Count-like metrics (dwellings,
            population, age-band and other person counts, SGB2 BG, PERS,
            ELB, NEF, RLB) are whole numbers. Rates, shares, and percentages
            stay fractional.
        normalizedValue:
          type: number
          description: |
            Raw `value` divided by the area Bezugsgröße (`per_1000_inhabitants`
            is per 1.000 inhabitants). Omitted when the Bezugsgröße for that
            Fläche and year liegt nicht vor. Never invented as `0`.
            `baselineMethod: missing` always omits this field.
        baselineMethod:
          $ref: "#/components/schemas/BaselineMethod"
          description: |
            Method of the divisor actually used from `geo.area_baseline`.
            Omitted on older stored sets and on feature-derived fallback.
    SeriesBaseline:
      type: string
      description: |
        Bezugsgröße used to baseline a dataset on its own Fläche.
        `per_1000_inhabitants` — je 1.000 Einwohner.
        `per_km2` — je km² (Einwohner stock, or when area is the baseline).
        `per_household` — je Haushalt.
        Missing divisor → `normalizedValue` omitted, status `absent`.
      enum: [per_1000_inhabitants, per_km2, per_household]
    BaselineMethod:
      type: string
      description: |
        Method of the Bezugsgröße from Brain `geo.area_baseline`.
        Einwohner: `official` | `official_zensus2022_grid` |
        `estimate_lor_sum` | `estimate_zensus2022_grid_sum` |
        `estimate_address` | `missing` (never a silent NULL). Fläche:
        `geom` | `official` | `fixed_grid`. `missing` means
        `normalizedValue` is absent; never divide by 1. Zensus methods
        are not remapped to `estimate_address`.
      enum:
        [
          official,
          official_zensus2022_grid,
          estimate_lor_sum,
          estimate_zensus2022_grid_sum,
          estimate_address,
          missing,
          geom,
          fixed_grid,
        ]
    YearlySeries:
      type: object
      additionalProperties: false
      required:
        - metricId
        - requestedLevel
        - requestedGeoKey
        - sourceLevel
        - sourceGeoKey
        - granularity
        - coverage
        - points
      description: |
        One topic on one Zielregion over the last three UTC calendar years
        (`year`) or the last 36 UTC months (`month`). When the newest Brain
        year is older than `asOf` but still within two years, the year
        window ends on that Brain year so a series such as Wanderungen
        through 2024 stays `multi`. `coverage` tells the client whether a
        trend exists. `sourceLevel` / `sourceGeoKey` are the Brain row, not
        the picker grain. Unfallatlas Gebiet may be Ortsteil, Bezirk, or
        PLZ when that key exists; Gemeinde/Kreis/Land AGS series stay on
        grain `ags` / `ags5` / `other` and are labeled as such. An Ortsteil
        or Stadtteil picker still produces this array: missing local rows
        fall back to Gemeinde / Kreis / Land. Grain `ags5` / a 5-digit AGS
        is requested as `kreis`. Missing cells are `absent` without `value`.
        Store revenue is not included.
      properties:
        metricId:
          type: string
          description: |
            Address-pair topic id (`bevoelkerung`, `pendler`, …) or a Brain
            series theme id (`destatis_wohnungen`, `kba_elektro_pkw`,
            `hamburg_stadtteil_regionalstatistik`,
            `muenchen_indikatorenatlas`, `berlin_lor_ewr_bevoelkerung`,
            `koeln_statistischer_datenkatalog`, `leipzig_lis_ortsteil`,
            `duesseldorf_bevoelkerung_stadtteile`,
            `essen_bevoelkerung_stadtteile`,
            `frankfurt_demographie_stadtteile`, …).
            Not store revenue. Kleinräumige themes score at the hit's own
            Ebene (Adresse, Raster, LOR/Quartier, Ortsteil, Stadtbezirk)
            and do not require an embedding. Berlin LOR 2021 PLR and 2006
            are separate series.
        requestedLevel:
          $ref: "#/components/schemas/SeriesLevel"
        requestedGeoKey:
          type: string
        sourceLevel:
          $ref: "#/components/schemas/SeriesLevel"
        sourceGeoKey:
          type: string
          description: Geo key of the Brain row, or the Gemeinde/Kreis/Land key that was looked up.
        granularity:
          $ref: "#/components/schemas/SeriesGranularity"
        coverage:
          $ref: "#/components/schemas/SeriesCoverage"
        valueKey:
          type: string
          description: Metadata field the `value` numbers were taken from, when the row is an object.
        points:
          type: array
          description: |
            Every expected period in the window. Missing Brain rows are
            `absent` without `value`. Present points are stored cells only.
          items:
            $ref: "#/components/schemas/SeriesPoint"
    AnalysisPattern:
      type: object
      additionalProperties: false
      required: [source, summary, revenueDirection, criteria]
      description: |
        Persisted pattern for recommendations. `source` is `llm` when the
        criteria were taken from the language model and checked against the
        store-surrounding facts, otherwise `heuristic`. `yearlySeries` is the
        three-year small-area Brain history for the user's Zielregionen
        (Verlauf). Pattern `criteria` come from Bestandstandort surroundings.
        A `coverage` of `single` is a Stichtag, not a trend.
      properties:
        source:
          type: string
          enum: [llm, heuristic]
        summary:
          type: string
        revenueDirection:
          $ref: "#/components/schemas/RevenueDirection"
        criteria:
          type: array
          maxItems: 5
          description: |
            At most five grounded criteria. Heuristic values come from
            Bestandstandort surroundings (Adresse → Raster → LOR/Quartier →
            Ortsteil → PLZ5 → Bezirk → Gemeinde; Kreis is Rahmen only, e.g.
            Köln ags5 `05315`), never from clipping Brain facts to the
            Zielregion. Destatis `bev_insgesamt` at ags5 is preferred for
            Einwohner over Zensus `ewz`. A Kreis or Land fallback is labeled
            as such. Missing values are absent (liegt nicht vor), never
            invented.
          items:
            $ref: "#/components/schemas/PatternCriterion"
        yearlySeries:
          type: array
          items:
            $ref: "#/components/schemas/YearlySeries"
    PatternCriterion:
      type: object
      additionalProperties: false
      required: [key, label, direction, evidence]
      properties:
        key:
          type: string
          maxLength: 120
        label:
          type: string
        direction:
          $ref: "#/components/schemas/CriterionDirection"
        evidence:
          type: string
          description: |
            Grounded in store-surrounding Brain series or the stored revenue
            series. Nested metric keys use the leaf in heuristic period stamps
            (`wohnungen.raeume` → `2020|Räume` / `raeume`), not the parent
            Brain `ref_period` suffix (`2020|wohnungen`). Heuristic numbers
            use only the Filialumgebung keys, never a mean across foreign
            places. Stichtag snapshots say so; missing cells are
            `liegt nicht vor`, never `0`.
        kind:
          $ref: "#/components/schemas/CriterionKind"
        coverage:
          $ref: "#/components/schemas/SeriesCoverage"
        sourceLevel:
          $ref: "#/components/schemas/SeriesLevel"
          description: Flächenebene on which this dataset is present.
        sourceGeoKey:
          type: string
        scope:
          $ref: "#/components/schemas/EvidenceScope"
          description: |
            Present on `patternByLevel` / `patternByDataset` criteria.
            `local` is native to that Fläche. `inherited` was taken from a
            coarser parent and does not differentiate siblings. Omitted on
            older `pattern.criteria`.
        metricId:
          type: string
          description: |
            Dataset / Brain theme id this criterion compares (`kba_elektro_pkw`,
            `unfallatlas`, …). Same as `key` on new sets. Additive.
        baseline:
          $ref: "#/components/schemas/SeriesBaseline"
          description: |
            Bezugsgröße for the relative match. Omitted on older stored sets.
        rawValue:
          type: number
          description: |
            Latest present raw Brain cell. Omitted when every period is absent.
        normalizedValue:
          type: number
          description: |
            Latest present `rawValue` after baselining. Omitted when the
            Bezugsgröße liegt nicht vor. Never `0` as a stand-in.
        baselineMethod:
          $ref: "#/components/schemas/BaselineMethod"
          description: |
            Method of the latest present Bezugsgröße. `missing` when the
            catalog theme has no usable divisor for that year.
    PatternLevel:
      type: string
      description: |
        Canonical Ebene of a store-surroundings Musterprofil.
        `stadtteil` folds into `ortsteil`; `stadtbezirk` into `bezirk`.
        `kreis` is Rahmen only (`role: frame`).
      enum: [address, grid100, lor, quartier, ortsteil, plz, bezirk, gemeinde, kreis]
    PatternLevelRole:
      type: string
      enum: [pattern, frame]
      description: |
        Geography inventory on `patternByLevel`. `frame` (Kreis) is context
        only. Compare/score uses `patternByDataset`, not same-Ebene matching.
    PatternLevelProfile:
      type: object
      additionalProperties: false
      required: [level, role, geoKeys, yearlySeries, criteria]
      description: |
        Store-surroundings pattern at one Ebene. `yearlySeries` are the
        last three available years for that Ebene. Missing years are
        `absent` (liegt nicht vor), never `0`. `criteria` are derived
        from those series (max 5) with `scope` `local` or `inherited`.
      properties:
        level:
          $ref: "#/components/schemas/PatternLevel"
        role:
          $ref: "#/components/schemas/PatternLevelRole"
        geoKeys:
          type: array
          items:
            type: string
          description: Bestandstandort geo keys aggregated at this Ebene.
        yearlySeries:
          type: array
          items:
            $ref: "#/components/schemas/YearlySeries"
        criteria:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/PatternCriterion"
    PatternDatasetProfile:
      type: object
      additionalProperties: false
      required: [metricId, baseline, sourceLevel, sourceGeoKey, yearlySeries, criterion]
      description: |
        Store-surroundings Musterprofil for one dataset. `yearlySeries` is
        the finest Bestandstandort Fläche where that metric exists.
        `normalizedValue` on points and on `criterion` is the relative
        match (je 1.000 Einwohner, je km², or je Haushalt). Missing
        Bezugsgröße omits `normalizedValue`. Additive; older stored sets
        may omit `patternByDataset`.
      properties:
        metricId:
          type: string
        baseline:
          $ref: "#/components/schemas/SeriesBaseline"
        sourceLevel:
          $ref: "#/components/schemas/SeriesLevel"
          description: Flächenebene on which this dataset is present.
        sourceGeoKey:
          type: string
        yearlySeries:
          $ref: "#/components/schemas/YearlySeries"
        criterion:
          $ref: "#/components/schemas/PatternCriterion"
        baselineMethod:
          $ref: "#/components/schemas/BaselineMethod"
          description: |
            Method of the Bezugsgröße on this dataset profile. Additive.
        baselineMatch:
          type: boolean
          description: |
            True when this Musterprofil baseline matches the candidate
            evidence baseline for the same metricId. False → show
            „liegt nicht vor“ on the Musterlinie. Additive.
    AnalysisPatternRegion:
      type: object
      additionalProperties: false
      required: [label, geoKey]
      description: |
        Snapshot place this pattern belongs to, for the Stand line
        (`Stand: Lauf vom … für [label]`). Unfiltered GET uses `input.region`.
        With `geoKey`, the matching list item. `parentLabel` is optional.
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 200
        geoKey:
          type: string
          nullable: true
          maxLength: 200
          description: Stored catalog key of the snapshot place. Null when unknown.
        level:
          allOf:
            - $ref: "#/components/schemas/CatalogLevel"
          nullable: true
        parentLabel:
          type: string
          nullable: true
          description: Parent municipality name. Null when unknown or the place is the municipality.
        grain:
          type: string
          nullable: true
          enum: [address, grid100, plz8, plz5, ags, ags5, other]
    AnalysisPatternResponse:
      type: object
      additionalProperties: false
      required: [runId, createdAt, region, pattern]
      properties:
        runId:
          type: string
        createdAt:
          type: string
          format: date-time
        region:
          $ref: "#/components/schemas/AnalysisPatternRegion"
        pattern:
          $ref: "#/components/schemas/AnalysisPattern"
    RecommendationCreate:
      type: object
      additionalProperties: false
      description: |
        Optional body for `POST /recommendations`. Omit `runId` to use the
        newest completed analysis run of the token user.
      properties:
        runId:
          type: string
          pattern: "^[1-9][0-9]{0,18}$"
          description: Analysis run id as a decimal string. Must belong to the token user.
    RecommendationTargetRegion:
      type: object
      additionalProperties: false
      required: [geoKey]
      description: |
        One Zielregion of a recommendation set. `geoKey` is the key
        used as `items[].targetRegionGeoKey` (not necessarily
        `AnalysisRegion.geoKey` — see fallbacks there).
      properties:
        geoKey:
          type: string
          description: |
            Key used as `Recommendation.targetRegionGeoKey`.
            `AnalysisRegion.geoKey` when non-empty; otherwise `ags:{ags}`;
            otherwise `label:{normalized label}`.
        label:
          type: string
          description: Display label of the Zielregion.
    RecommendationSet:
      type: object
      additionalProperties: false
      required: [id, runId, createdAt, window, count, reason, pattern, items]
      description: |
        Ranked Teilflächen the web client binds to. `count` is
        `items.length`. `reason` is null when at least one sub-area
        exists and the catalog read was not truncated. `pattern` is the
        flattened store-surroundings snapshot (older clients).
        `patternByLevel` is the geography inventory je Ebene.
        `patternByDataset` is the Musterprofil used for dataset compare
        (normalized trend per metricId). `targetRegions` lists the
        used `targetRegionGeoKey` per Zielregion (additive, 0.19.2).
        Empty `items` only when no sub-area exists inside the Zielregion. Hit size is the Fläche
        where the dataset lives, not the smallest admin Ebene at all
        costs; several datasets yield their intersection.
      properties:
        id:
          type: string
          description: Recommendation set id as a decimal string.
        runId:
          type: string
          description: Analysis run this set was ranked from.
        createdAt:
          type: string
          format: date-time
        window:
          $ref: "#/components/schemas/RecommendationWindow"
        count:
          type: integer
          minimum: 0
          maximum: 200
        reason:
          type: string
          nullable: true
          description: |
            German explanation when no finer Teilfläche exists inside the
            region, or when the catalog read hit its row limit. Null when
            finest sub-areas were ranked without truncation.
        pattern:
          $ref: "#/components/schemas/AnalysisPattern"
        patternByLevel:
          type: array
          description: |
            Store-surroundings Musterprofil je Ebene, finest → coarse.
            New `POST /recommendations` includes the Ebenen resolved for
            the Bestandstandorte. Older stored sets may omit this field.
            Geography inventory only; compare/score uses `patternByDataset`.
            Kreis is `role: frame` and does not differentiate siblings.
          items:
            $ref: "#/components/schemas/PatternLevelProfile"
        patternByDataset:
          type: array
          description: |
            Store-surroundings Musterprofil je Datensatz (normalized
            value + three-year trend at the finest Fläche where that
            metric exists). New `POST /recommendations` always includes
            it. Older stored sets may omit the field. Web uses this to
            show the relative dataset match, not only Muster je Ebene.
            Clients join `criteriaEvidence[].metricId` to
            `yearlySeries` here for the Musterverlauf — that series is
            not duplicated on each Recommendation item.
          items:
            $ref: "#/components/schemas/PatternDatasetProfile"
        targetRegions:
          type: array
          description: |
            Zielregionen of this set, snapshot order. `geoKey` is the
            key actually used as `items[].targetRegionGeoKey`.
            Resolution (0.19.2): `AnalysisRegion.geoKey` when non-empty;
            otherwise `ags:{ags}` when AGS is present; otherwise
            `label:{normalized label}` (trim, collapse whitespace,
            lowercase). Present on new sets. Older stored sets may omit
            the field. Ranking accepts at most 200 Zielregionen
            (n ≤ 66 → ≥3 ranked slots each; 67–200 → ≥1 via
            `floor(200/n)`). More than 200 is rejected. There is no
            separate per-user cap on `POST /target-region`.
          maxItems: 200
          items:
            $ref: "#/components/schemas/RecommendationTargetRegion"
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/Recommendation"
    RecommendationWindow:
      type: object
      additionalProperties: false
      required: [from, to]
      description: |
        Three calendar years used for trend ranking (`YYYY`), inclusive.
        Older stored sets may still use `YYYY-MM` (six-month window).
      properties:
        from:
          type: string
          pattern: "^[0-9]{4}(-[0-9]{2})?$"
          description: Oldest year (or month) in the window.
          example: "2023"
        to:
          type: string
          pattern: "^[0-9]{4}(-[0-9]{2})?$"
          description: Newest year (or month) in the window.
          example: "2025"
    Recommendation:
      type: object
      additionalProperties: false
      required: [id, rank, title, kind, location, score, rationale, criteriaEvidence, source, name, targetRegionGeoKey]
      properties:
        id:
          type: string
          description: |
            Unique area id inside this set. `{grain}:{geoKey}` when the
            item has no Zielregion; when loaded for a Zielregion (0.19.2)
            `{grain}:{geoKey}@{targetRegionGeoKey}` so the same Fläche
            can appear once per region with its own rank, clipped
            geometry, and overlaps.
          example: "other:ortsteil:osm:5712247@ortsteil:osm:55737"
        rank:
          type: integer
          minimum: 1
          maximum: 200
          description: je Zielregion (targetRegionGeoKey) 1-basiert und lückenlos, über alle Ebenen gemeinsam nach score absteigend
        title:
          type: string
          description: |
            Card title. Same display name as `name` — never a raw catalog
            key (`koeln:sq:…`, `lor:plr:…`, `plz5:…`).
        kind:
          $ref: "#/components/schemas/AreaKind"
          description: |
            Ebene of this hit (Adresse, 100-m-Raster, Ortsteil, LOR, PLZ,
            Bezirk, Gemeinde). Required on new sets.
        grain:
          $ref: "#/components/schemas/Grain"
          description: |
            Official grain of this hit (same token as `location.grain`).
            Present on new sets from 0.19.0. Older stored sets may omit
            it — then read `location.grain`.
        name:
          type: string
          description: |
            Display name of this hit. Always set on new sets (0.19.1).
            Never a catalog key (`plz5:…`, `ortsteil:osm:…`, `koeln:sq:…`,
            `lor:plr:…`), never `osm:`, `id:`, `address:`, `geo_addr`,
            an INSPIRE / cell id, or the word unbekannt. Prefer the
            catalog / feature name. Fallbacks: PLZ → `PLZ 80331` or
            `PLZ ohne Namen`; LOR → catalog name or
            `Planungsraum ohne Namen` (never the LOR/PLR number);
            Köln-Quartier → feature title or `Quartier ohne Namen`
            (never the Quartier id, never `Quartier <id>`);
            Raster → `100-m-Rasterzelle`
            (no cell id); Adresse → Straße + Hausnummer or
            `Adresse ohne Hausnummer`; otherwise `{Art} ohne Namen`.
            Fallbacks never contain a digit sequence, number, or id
            except PLZ (`PLZ 80331`) and street + house number.
            Never `0` and never the raw geoKey.
        parentLabel:
          type: string
          nullable: true
          description: |
            Gemeinde display name for every Ebene below municipality
            (stadtbezirk, bezirk, stadtteil, ortsteil, quartier, lor,
            plz, raster, adresse). Source is `geo_ref_admin` or the
            Zielregion `parentLabel` (München, Hamburg, Berlin, Köln
            included). Null when unknown or the hit is the Gemeinde.
            Never a PLZ, never the first coarser candidate in an AGS
            pool, never a catalog key. Never taken from another city's
            Zielregion (`ags` match only when both AGS are non-empty;
            no fallback to `regions[0]`).
        targetRegionGeoKey:
          type: string
          description: |
            Key of the user Zielregion this item belongs to. Required
            on new sets (0.19.2). Rank, geometry clip, overlaps, and
            share are scoped to this key. Resolution:
            `AnalysisRegion.geoKey` when non-empty; otherwise
            `ags:{ags}` when AGS is present; otherwise
            `label:{normalized label}` (trim, collapse whitespace,
            lowercase). The same key is listed on
            `RecommendationSet.targetRegions[].geoKey` so clients can
            join items to Zielregionen. Older stored sets may send an
            empty string after hydration.
          example: "ortsteil:osm:55737"
        dataAsOf:
          type: string
          nullable: true
          pattern: "^[0-9]{4}(-[0-9]{2})?$"
          description: |
            Newest data point used for this item: year `YYYY` or month
            `YYYY-MM`, taken from `criteriaEvidence.points[].period`
            (present points). Null when no data point exists. The
            Musterverlauf is **not** on the item — join
            `criteriaEvidence[].metricId` to
            `set.patternByDataset[].yearlySeries`.
          example: "2025"
        intersectionOf:
          type: array
          description: |
            Named parts of a dataset Schnittfläche so clients can show
            „Schnittfläche aus A und B“ without parsing `title`.
            Each part is one dataset Fläche (`geoKey` is the id, `name`
            is the display name). Empty or omitted when this hit is a
            single Fläche. This is **not** the spatial parent list —
            see `overlaps`.
          items:
            $ref: "#/components/schemas/RecommendationIntersectionPart"
        overlaps:
          type: array
          description: |
            Zielregion and Ortsteile this **unclipped** candidate
            spatially intersects. The first entry is always the item's
            Zielregion (`isTargetRegion: true`) with
            `share` = candidate ∩ Zielregion / candidate area (0–1,
            EPSG:3035). Further entries are Ortsteile of the unclipped
            candidate, share descending, fragments below 1 % omitted.
            `label` is a display name, never a catalog key.
            Omit the field when nothing remains (or when the Brain
            read failed — the run still completes). Computed for PLZ,
            LOR, Ortsteil, Quartier, Raster (`grid100`) and Adresse
            (points typically share 1). Additive 0.19.5; clients that
            ignore unknown fields keep working.
          items:
            $ref: "#/components/schemas/RecommendationOverlap"
        location:
          $ref: "#/components/schemas/RecommendationLocation"
        score:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: |
            Closeness of this Teilfläche to the store-surroundings pattern
            on the shared baseline (0..1). Per local dataset: proximity =
            1 − min(1, |Kandidat − Muster| / robuste Streuung) with MAD
            (IQR fallback) over candidates of that dataset and Ebene.
            Trend (weight 0.6) before niveau (0.4); coverage `single` is
            not a trend. The trend delta is divided by the year span.
            Inherited or under-dispersed datasets are
            neutral (omitted). Grain weights prefer the finer Ebene the
            dataset is present on. Coverage factor
            min(1, nAktiv / kMin) with kMin default 2 so a single
            dataset never yields 1.0. Missing cells stay absent, never
            `0`. Candidates without local dataset hits drop when
            siblings have local data; inherited/Stichtag-only areas
            stay with score 0 and are ordered by Zielregion share,
            then `id`. Additive `criteriaEvidence[].proximity` is the
            per-dataset closeness before the item coverage factor.
            Polygon candidates need ≥ `ANALYSIS_MIN_OVERLAP_SHARE`
            (default 0.10) of their area inside the Zielregion.
            Additive `localDatasetCount` (0.19.6) is nAktiv on this item.
        localDatasetCount:
          type: integer
          minimum: 0
          description: |
            Additive 0.19.6. nAktiv: number of local datasets that
            contribute to the score — `criteriaEvidence[]` entries with
            a numeric `proximity` (`0` is valid closeness and counts).
            `0` means only inherited or Stichtag values (no local
            closeness). Omitted on older stored sets. Web path:
            `items[].localDatasetCount`. Bind the nAktiv-0 card to
            `localDatasetCount === 0`; do not re-derive from evidence
            kind/scope (that heuristic can diverge from nAktiv).
        rationale:
          type: string
          description: |
            German Begründung. Names only criteria and figures present in
            `criteriaEvidence`.
        criteriaEvidence:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/RecommendationEvidence"
        source:
          type: string
          enum: [llm, heuristic]
          description: |
            `llm` when `rationale` was taken from the local model and checked
            against `criteriaEvidence`. `heuristic` when the model was unset,
            failed, or its text was discarded.
        geometry:
          nullable: true
          description: |
            True outline of this hit for the map (EPSG:4326). Dataset Fläche
            clipped to the Zielregion (`ST_Intersection`). Never a bounding
            box or circle. Null only when the outline cannot be computed.
          allOf:
            - $ref: "#/components/schemas/RegionGeometry"
        geometryUnavailableReason:
          type: string
          nullable: true
          description: |
            German reason when `geometry` is null (e.g. Schnittfläche leer
            oder Brain-Geometrie fehlt). Null when `geometry` is set.
        trend:
          $ref: "#/components/schemas/RecommendationTrend"
          description: |
            Backend-only Entwicklungssatz und Richtung für diesen Treffer.
            Omitted or `direction: unknown` with empty/absent summary when
            coverage is `single` or `none`. Clients must not derive this
            from `criteriaEvidence.points`.
    RecommendationTrend:
      type: object
      additionalProperties: false
      required: [direction, summary]
      description: |
        Aggregated three-year development for one hit, computed by the
        backend from local normalized trend criteria. One source of truth
        for Web/iOS/Android.
      properties:
        direction:
          $ref: "#/components/schemas/CriterionDirection"
        summary:
          type: string
          description: |
            German Entwicklungssatz (e.g. Datensatz steigt seit drei Jahren,
            je 1.000 Einwohner). Empty string when no local trend exists.
    RecommendationIntersectionPart:
      type: object
      additionalProperties: false
      required: [geoKey, grain, name]
      description: |
        One Fläche that forms a Schnittfläche hit. `geoKey` is only the
        id. `name` is the display name — never a catalog key. Missing
        names are null (liegt nicht vor).
      properties:
        geoKey:
          type: string
          description: Catalog / Brain id of this part. Not for display.
        grain:
          $ref: "#/components/schemas/Grain"
        name:
          type: string
          nullable: true
          description: |
            Display name of this part. Null when the name liegt nicht
            vor. Never `0` and never the geoKey as a stand-in.
        datasetKey:
          type: string
          description: |
            Pattern / Brain metric id that lives on this Fläche.
            Omitted when the part is not tied to one dataset.
    RecommendationOverlap:
      type: object
      additionalProperties: false
      required: [geoKey, label, kind, share]
      description: |
        One Zielregion or Ortsteil that spatially overlaps this hit.
        `share` is the fraction of the **unclipped** candidate area
        (0–1). Never a catalog key as `label`. Additive 0.19.5:
        the Zielregion is first with `isTargetRegion: true`.
      properties:
        geoKey:
          type: string
          description: Catalog / Brain id of the overlapping area. Not for display.
        label:
          type: string
          description: |
            Display name of the overlapping area. Never a catalog key
            (`ortsteil:…`, `lor:plr:…`, `ags:…`).
        kind:
          $ref: "#/components/schemas/AreaKind"
          description: |
            Zielregion kind (often `ortsteil`) or `ortsteil` /
            `stadtteil` for parent parts.
        share:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: |
            Intersection area divided by the unclipped candidate area,
            after transforming geometries to EPSG:3035. Zielregion
            entries are kept even below 0.01; Ortsteil fragments below
            0.01 are omitted.
        isTargetRegion:
          type: boolean
          description: |
            Additive 0.19.5. True on the item's Zielregion entry
            (always first). Omitted on Ortsteile.
    RecommendationLocation:
      type: object
      additionalProperties: false
      required: [geoKey, grain, lon, lat, name]
      properties:
        geoKey:
          type: string
        grain:
          allOf:
            - $ref: "#/components/schemas/Grain"
          deprecated: true
          description: |
            Deprecated. Use top-level `Recommendation.grain`. Kept for
            compatibility.
        lon:
          type: number
          format: double
          nullable: true
        lat:
          type: number
          format: double
          nullable: true
        name:
          type: string
          nullable: true
          deprecated: true
          description: |
            Deprecated. Use top-level `Recommendation.name`. Brain place
            name when the row has one. Null when the name liegt nicht vor.
    RecommendationEvidence:
      type: object
      additionalProperties: false
      required: [key, label, direction, patternDirection, evidence]
      description: |
        One pattern criterion observed on this Teilfläche.
        `kind` is `trend`, `stichtag`, or `absent`. `status` is `present`
        or `absent`. Missing values omit `value` / `normalizedValue` and
        are never `0`. `patternDirection` is the stored Musteranalyse
        direction. `scope` is `local` when the series is native to this
        Fläche, or `inherited` when it was taken from a coarser parent.
        `metricId`, `baseline`, `rawValue`, `normalizedValue`, and
        `sourceLevel` (Flächenebene) describe the dataset compare.
        Additive `proximity` (0.19.4) is closeness to the Musterwert on
        the baseline; omitted when the dataset is absent, inherited, or
        statistically neutral. Additive `trendYears` is the number of
        distinct calendar years of a local trend (2 = two-year trend).
        Additive `trendFromTwoYears` (0.19.5) is true when `trendYears`
        is 2.
      properties:
        key:
          type: string
        label:
          type: string
        direction:
          $ref: "#/components/schemas/CriterionDirection"
        patternDirection:
          $ref: "#/components/schemas/CriterionDirection"
        evidence:
          type: string
          description: |
            German sentence with the years/Stichtag and figures used for the
            score, or `liegt nicht vor`. Nested metric keys use the leaf
            label (`Räume` / `raeume` for `wohnungen.raeume`), not the parent key.
        kind:
          $ref: "#/components/schemas/EvidenceKind"
        status:
          $ref: "#/components/schemas/SeriesPointStatus"
        match:
          type: boolean
          description: True when a trend criterion moved in the pattern direction.
        coverage:
          $ref: "#/components/schemas/SeriesCoverage"
        scope:
          $ref: "#/components/schemas/EvidenceScope"
        sourceLevel:
          $ref: "#/components/schemas/SeriesLevel"
          description: Flächenebene on which this dataset is present.
        points:
          type: array
          items:
            $ref: "#/components/schemas/SeriesPoint"
        metricId:
          type: string
          description: Dataset / Brain theme id compared on this Fläche.
        baseline:
          $ref: "#/components/schemas/SeriesBaseline"
        rawValue:
          type: number
          description: Latest present raw Brain cell. Omitted when absent.
        normalizedValue:
          type: number
          description: |
            Latest present baselined value. Omitted when the Bezugsgröße
            liegt nicht vor. Never invented as `0`.
        baselineMethod:
          $ref: "#/components/schemas/BaselineMethod"
          description: |
            Method of the divisor used on this Teilfläche. Additive.
        baselineMatch:
          type: boolean
          description: |
            True when this criterion uses the same `baseline` Bezugsgröße as
            the Muster `patternByDataset` entry for this metricId. False when
            they differ — then the Musterlinie is treated as absent
            („liegt nicht vor“) and does not drive compare. Additive.
        proximity:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: |
            Additive 0.19.4. Closeness of this dataset to the store
            pattern on the shared baseline (trend and/or niveau, 0..1).
            Omitted when the dataset is absent, inherited, or has too
            few distinct local values to score (neutral). Missing data
            is never stored as `0`. Does not include the item-level
            coverage factor.
        trendYears:
          type: integer
          minimum: 2
          description: |
            Additive 0.19.4. Distinct calendar years used for this
            dataset's yearly trend rate (last−first normalizedValue /
            year span). `2` means a two-year trend (clients may label
            „Trend aus 2 Jahren“). Omitted when coverage is `single` /
            `none` or fewer than two years. Never `0`.
        trendFromTwoYears:
          type: boolean
          description: |
            Additive 0.19.5. True when `trendYears` is 2. Omitted
            otherwise. Web path:
            `items[].criteriaEvidence[].trendFromTwoYears`.
    AddressPairRequest:
      type: object
      additionalProperties: false
      required: [left, right]
      properties:
        left:
          $ref: "#/components/schemas/AddressInput"
        right:
          $ref: "#/components/schemas/AddressInput"
    AddressInput:
      type: object
      additionalProperties: false
      required: [street, postalCode, city]
      properties:
        street:
          type: string
          minLength: 1
          maxLength: 200
        postalCode:
          type: string
          pattern: "^[0-9]{5}$"
        city:
          type: string
          minLength: 1
          maxLength: 120
    AddressPairResult:
      type: object
      additionalProperties: false
      required: [left, right, shared]
      properties:
        left:
          $ref: "#/components/schemas/AddressSide"
        right:
          $ref: "#/components/schemas/AddressSide"
        shared:
          type: array
          items:
            $ref: "#/components/schemas/SharedTopic"
    AddressSide:
      type: object
      additionalProperties: false
      required: [input, resolution, gemeinde, kreis, land, topics]
      properties:
        input:
          $ref: "#/components/schemas/AddressInput"
        resolution:
          $ref: "#/components/schemas/AddressResolution"
        gemeinde:
          allOf:
            - $ref: "#/components/schemas/PlaceName"
          nullable: true
        kreis:
          allOf:
            - $ref: "#/components/schemas/PlaceName"
          nullable: true
        land:
          allOf:
            - $ref: "#/components/schemas/PlaceName"
          nullable: true
        topics:
          type: array
          items:
            $ref: "#/components/schemas/AddressTopic"
    AddressResolution:
      type: string
      enum: [resolved, unknown]
    PlaceName:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
    AddressTopic:
      type: object
      additionalProperties: false
      required: [id, level, status]
      properties:
        id:
          type: string
          minLength: 1
        level:
          $ref: "#/components/schemas/TopicLevel"
        status:
          $ref: "#/components/schemas/TopicStatus"
        value:
          description: |
            Stored Brain row. Present only when `status` is `present`.
            Omitted entirely when `status` is `absent`.
    SharedTopic:
      type: object
      additionalProperties: false
      required: [id, level, left, right]
      properties:
        id:
          type: string
          minLength: 1
        level:
          $ref: "#/components/schemas/TopicLevel"
        left: {}
        right: {}
    TopicLevel:
      type: string
      enum: [gemeinde, kreis, land]
    TopicStatus:
      type: string
      enum: [present, absent]
    ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        error:
          type: string
        code:
          type: string
          description: |
            Stable machine-readable error code. Additive; omitted on
            older errors. `marked_target_region_not_found` on
            `POST /analysis/runs` when `markedTargetRegionGeoKey` is
            unknown or foreign.
