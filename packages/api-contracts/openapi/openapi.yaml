openapi: 3.0.3
info:
  title: RuehrAI API
  version: 0.9.0
  description: |
    Dev-Team slice (v0). The backend issues its own JWTs and reads a local
    Postgres database via `DATABASE_URL`. Clients call this API; they do not
    talk to the database.

    Base URL is environment-driven. Local default is `http://localhost:3000`
    (`PORT`, default 3000). Deployed clients should take the base URL from
    their own configuration and use this document as the contract.

    Local migrations seed a development user `dev@ruehrai.local` /
    `dev-password`. That account is a fixture for local runs, not a production
    credential. `POST /auth/register` creates further users in `app.users`.
    `POST /auth/logout` revokes that access token until it expires.

    Customer inputs (target-region list, store addresses, monthly revenue) are
    stored in schema `app` and are visible only to the user id in the token.
    The signed-in user has a list of target regions. That list is the set used
    for the location search, not a single overwrite slot. `0.6.1` adds
    `gemeinde` to `CatalogLevel` for a municipality (grain `ags`).
    `0.7.0` adds `POST /address-pair`: two addresses, looked up by postal code
    only, returning Gemeinde / Kreis / Land topics from Brain.
    `0.8.0` adds `AnalysisPattern.yearlySeries`: stored Brain values for the
    last three calendar years (or last 36 months) on the user's Zielregionen.
    `coverage` is `single` when only one period is present — that is not a
    trend. Missing periods are `absent` (liegt nicht vor).
    `0.9.0` maps the remaining Brain multi-year themes (`destatis_wohnungen`,
    `destatis_kfz_bestand`, `destatis_bevoelkerung_alter`, `kba_elektro_pkw`,
    `ba_sgb2`, `kba_neuzulassungen`, `kba_bestand`, `unfallatlas_gebiet`) onto
    `yearlySeries`, prefers the most local Unfallatlas Gebiet key, uses
    Berlin Regionalstatistik Bezirk AGS8 (`11007007`) when present, strips
    `ref_period` tags after `|`, never filters on embedding, always
    recomputes the field on `GET /analysis/pattern` and new runs, and
    anchors a yearly window to the latest Brain year when that year is still
    within two years of `asOf`.

    Analysis (0.3.0) snapshots that input, reads kleinräumige Brain facts for
    the target region, and persists a pattern (criteria and direction).
    Recommendations (0.4.0) rank up to three locations in that region where
    the saved pattern fits over the last six calendar months, and attach a
    German rationale per location.

    Map (0.5.0) keeps store pins and the target-region overlay on this API.
    Store `lon`/`lat` are WGS84. Clients are not required to send them.
    KAN-56 Option A: when a write omits both, the API looks up Data-Scout
    `geo_ref_address` (street and house number plus PLZ). The PLZ5 centroid
    (`geo_ref_plz`, then `app.search_places` or a Point in `app.map_features`)
    is used only when that address misses. If the client sends both `lon` and
    `lat`, that pair is stored as sent. No public geocoder is called.
    Each saved target region has `bounds` (west, south, east, north) for map
    fitBounds together with store pins, and `geometry` (GeoJSON Polygon or
    MultiPolygon, EPSG:4326, longitude then latitude) for a semi-transparent
    fill and outline. Labels stay client-side. Clients call only this API.
servers:
  - url: http://localhost:3000
    description: Local development. The host and port follow the backend `PORT` env (default 3000).
tags:
  - name: Health
  - name: Auth
  - name: Search
  - name: Layers
  - name: TargetRegion
  - name: Stores
  - name: Analysis
  - name: Recommendations
  - name: AddressPair
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness
      description: Process is up. This check does not query Postgres.
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Exchange email and password for a JWT
      description: |
        Returns a bearer token. Local databases seeded by `db/migrations`
        include `dev@ruehrai.local` / `dev-password`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
            example:
              email: dev@ruehrai.local
              password: dev-password
      responses:
        "200":
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Unknown email or wrong password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: |
            The database connection failed after a short retry. The credentials
            were not rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Create a user and return a JWT
      description: |
        Password hashing is done in Postgres (`pgcrypto` bcrypt) and the row is
        stored in `app.users`. Minimum password length is 8. The response matches
        `POST /auth/login`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: User created and signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email is already registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: |
            The database connection failed after a short retry. The body was
            not rejected and the email was not reported as a duplicate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Current user
      description: "Requires Authorization: Bearer <accessToken>."
      responses:
        "200":
          description: User row for the token subject.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current access token
      description: |
        Requires `Authorization: Bearer <accessToken>`. Stores the token id
        (`jti`) in `app.revoked_tokens` until the token's own expiry. A later
        request with the same token is `401`. Clients should also drop the
        token locally. This is the Slice-1 session end: JWTs stay stateless
        apart from this denylist. There is no refresh token.
      responses:
        "204":
          description: Token revoked. The body is empty.
        "400":
          description: The token has no revocable id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /target-region:
    get:
      tags: [TargetRegion]
      operationId: listTargetRegions
      summary: List the signed-in user's target regions
      description: |
        The saved set used for the location search. Newest add first.
        An empty list is `200` with `items: []`, not `404`.

        Each item keeps the fields clients already show for a catalog hit:
        place name (`label`), `level`, and `parentLabel`. `geoKey` stays in
        the JSON so a later add or remove can name the place. Nothing in this
        API requires a client to display that key.

        `level` is the catalog token: `plz`; `bezirk` only for Berlin
        `11000001`–`11000012`; `stadtbezirk` for every other Bezirk;
        `stadtteil` or `ortsteil` from the catalog kind; `gemeinde` for a
        municipality (grain `ags`, such as München `09162000`). Never
        `gemeinde` for a sub-area. `parentLabel` is the parent municipality
        name, not a second name for the area. Empty when the catalog has no
        parent (München has none).
      responses:
        "200":
          description: Saved target regions, possibly none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetRegionList"
              example:
                items:
                  - label: Lankwitz
                    grain: other
                    geoKey: "ortsteil:osm:5712247"
                    level: ortsteil
                    parentLabel: Berlin
                    lon: 13.34
                    lat: 52.43
                    updatedAt: "2026-10-03T12:00:00.000Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [TargetRegion]
      operationId: addTargetRegion
      summary: Add a catalog place to the target-region list
      description: |
        Appends one place. Existing items stay. The new item is first on the
        next `GET`. This is not an overwrite of the whole list. There is no
        `PUT /target-region` that replaces the only row.

        Name the place with `geoKey`, `ags`, or `plz` from `GET /search`.
        Exact `geoKey` / `ags` / `plz` lookup still reloads a stored place
        on search; this write uses that same id. A historical Berlin Bezirk
        alias `11` + nnn + nnn is stored as official `1100000N`.

        A successful add always persists non-null `geometry` and `bounds`
        copied from the catalog MultiPolygon (Brain `geo`, then a non-stub
        `app.map_features` row, then Data-Scout). A GeoJSON Polygon or
        MultiPolygon on the request is stored instead. `bounds` without a
        polygon are ignored and do not become a rectangle. Never persist
        null geometry. If the catalog has no outline, the add is `400` and
        the list is unchanged. A municipality that simply has no sub-area
        is not an error; it can be added when it has an outline.

        The same catalog key appears at most once. A second add of that key
        returns the stored item and does not insert another row.

        `label`, `level`, and `parentLabel` are stored from the catalog hit
        when present. A municipality is returned as `level` `gemeinde`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetRegionWrite"
            example:
              label: München
              grain: ags
              geoKey: "09162000"
              ags: "09162000"
              lon: 11.5755
              lat: 48.1374
      responses:
        "201":
          description: Place added to the list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetRegion"
        "200":
          description: Place was already in the list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetRegion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [TargetRegion]
      operationId: clearTargetRegions
      summary: Clear the target-region list
      description: Idempotent. Responds `204` even when the list was empty.
      responses:
        "204":
          description: List cleared. The body is empty.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /target-region/{geoKey}:
    parameters:
      - $ref: "#/components/parameters/TargetRegionGeoKey"
    delete:
      tags: [TargetRegion]
      operationId: removeTargetRegion
      summary: Remove one place from the target-region list
      description: |
        Deletes the item whose stored catalog key matches `geoKey` after the
        same Berlin-alias rewrite as add. Idempotent: `204` when the key is
        not in the list. Other items stay.
      responses:
        "204":
          description: Place removed, or it was not in the list. The body is empty.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /stores:
    get:
      tags: [Stores]
      operationId: listStores
      summary: List the signed-in user's store addresses
      description: |
        A read persists `lon`/`lat` when the stored pair is null, or when an
        address match in Data-Scout replaces a pin that still sits on a PLZ
        centroid. An explicit pair is returned unchanged. Resolution order is
        the same as create.
      responses:
        "200":
          description: Stores owned by the token's user, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Stores]
      operationId: createStore
      summary: Add a store address
      description: |
        German address (`postalCode` is PLZ5, `countryCode` is `DE`).
        `street` includes the house number. `lon` and `lat` are optional WGS84
        (EPSG:4326) for the map pin. Clients are not required to send them.
        Send both or neither. KAN-56 Option A, when both are omitted:

        1. Data-Scout `geo_ref_address` (`strasse` + `hnr` parsed from `street`,
           plus `plz`). Berlin OSM coverage. This is the house-number pin.
        2. Data-Scout `geo_ref_plz` centroid, only when step 1 misses.
        3. PLZ centroid from `app.search_places`, then a Point in
           `app.map_features` with that PLZ, only when steps 1 and 2 miss.

        Steps 1 and 2 run only when `DATASCOUT_DATABASE_URL` is set and the
        read succeeds. Otherwise the API uses step 3. Coordinates stay null
        only when none of the steps hit. No public geocoder is called.
        Update uses the same order. A pair sent by the client is stored
        unchanged; it is an optional override, not the primary source.
        A read persists a filled null pair, and replaces a stored PLZ centroid
        when step 1 hits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreLocationWrite"
            example:
              label: Filiale Marienplatz
              street: Marienplatz 1
              postalCode: "80331"
              city: München
      responses:
        "201":
          description: Store created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreLocation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /stores/{id}:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      tags: [Stores]
      operationId: getStore
      summary: Read one store address
      description: "404 when the id is missing or belongs to another user."
      responses:
        "200":
          description: Store owned by the token's user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreLocation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No store with this id for the token's user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [Stores]
      operationId: updateStore
      summary: Replace a store address
      description: |
        Same coordinate rule as create. Omit `lon` and `lat` together to
        resolve Data-Scout `geo_ref_address`, then `geo_ref_plz`, then the
        `app.search_places` / `app.map_features` PLZ stub. Send both to keep
        an explicit WGS84 pin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreLocationWrite"
      responses:
        "200":
          description: Updated store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreLocation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No store with this id for the token's user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Stores]
      operationId: deleteStore
      summary: Delete a store address
      description: Also deletes monthly revenue for that store.
      responses:
        "204":
          description: Store deleted. The body is empty.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No store with this id for the token's user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stores/{id}/revenue:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      tags: [Stores]
      operationId: listStoreRevenue
      summary: Monthly revenue for one store
      description: |
        Points the customer has saved, ordered by year then month. A point with
        `revenueEur: null` was explicitly marked missing. A month with no point
        was not entered. At most 36 points are stored per store.
      responses:
        "200":
          description: Saved months. Empty `points` when none have been entered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyRevenueSeries"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No store with this id for the token's user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [Stores]
      operationId: putStoreRevenue
      summary: Upsert monthly revenue points
      description: |
        Inserts or replaces each `(year, month)` in the body. Other saved months
        stay. `revenueEur: null` marks that month as missing. The store can hold
        at most 36 months; a request that would exceed that returns `400` and
        changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonthlyRevenueWrite"
            example:
              points:
                - year: 2025
                  month: 1
                  revenueEur: 18450.5
                - year: 2025
                  month: 2
                  revenueEur: null
      responses:
        "200":
          description: Full series after the upsert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyRevenueSeries"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No store with this id for the token's user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stores/{id}/revenue/{year}/{month}:
    delete:
      tags: [Stores]
      operationId: deleteStoreRevenueMonth
      summary: Remove one monthly revenue point
      description: |
        `204` when the store exists, including when that month was not stored.
        `404` when the store is missing or belongs to another user.
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - name: year
          in: path
          required: true
          schema:
            type: integer
            minimum: 1990
            maximum: 2100
        - name: month
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        "204":
          description: Month removed, or it was not stored. The body is empty.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No store with this id for the token's user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /search:
    get:
      tags: [Search]
      operationId: searchPlaces
      summary: Search places by name, grain, or geo key
      description: |
        Reads Brain `geo` (PLZ, Stadtbezirk, Stadtteil, Ortsteil) together with
        `features.v_location_search` when that view contains at least one row.
        Free-text `q` matches the place name and, for catalog rows, `parentLabel`.
        It does not match internal catalog keys (`id`, `geo_key`, `geo_ags`) such
        as `plz5:12247`, `ortsteil:osm:…`, `stadtteil:osm:…`,
        `stadtbezirk:osm:…`, or `ags:…`. Typing one of those keys as `q` returns
        no hit. `lon` and `lat` are JSON null when the row has no coordinates.
        A row without a name is omitted; `label` is never empty.

        `q` is a substring of visible text. `type` limits `q` to grain `ags`,
        `plz5`/`plz8`, or `address`. Without `type`, `q` matches name and title
        (and catalog `parentLabel`). `type` has no effect when `q` is omitted.
        PLZ hits (`level=plz`, or grain `plz5`/`plz8`) appear only when the
        whole `q` is digits, for example `12247` or `80331`. A name query such
        as München, Hamburg, or Leipzig never returns PLZ rows. Ortsteil,
        Stadtteil, Stadtbezirk, and Bezirk still match a name query.

        `ags` and `plz` are exact geo_key matches on that grain. `geoKey` is an
        exact geo_key or catalog `id` match on any grain (reload of a stored
        place). `grain` is exact. `address` is a substring of name and title.
        Filters combine with AND.
        At most 50 hits, ordered by exact id/label match, then label.

        If the view is missing or has no rows (local docker-compose), the same
        filters run against the seeded `app.search_places` catalog and are
        merged with `geo` hits. Coordinates are WGS84 (EPSG:4326) when present.
        Rows with null or empty `geom` never appear. Berlin districts already
        in the seed or the view are not listed twice.

        A hit is a place id (`id`, `geoKey`, `grain`), not a polygon. Catalog
        hits also send `level` and `parentLabel` (and `geoAgs` when `geo_ags`
        is set). A municipality hit sends `level` `gemeinde` instead of
        omitting it. The Zielregion picker sends that id to `POST /target-region`
        without `geometry`. The write looks up a MultiPolygon in Brain `geo`,
        then a non-stub `app.map_features` row, then Data-Scout
        `geo_ref_bezirk` or `geo_ref_admin`. Search rows and Point features
        are not outlines. A Berlin Bezirk alias (`11006006`, `11007007`, and
        the same `11` + nnn + nnn pattern) is stored as official `1100000N`.
        A hit with no catalog polygon is rejected. Bounds or a point are not
        turned into a rectangle. One hit per geo key. The same display name
        may appear twice only when `parentLabel` differs.
      parameters:
        - name: q
          in: query
          required: false
          description: |
            Free-text substring of the place name and parent municipality.
            Does not match catalog keys. PLZ hits require `q` to be only digits.
          schema:
            type: string
            maxLength: 200
        - name: type
          in: query
          required: false
          description: Field that `q` is matched against. Ignored when `q` is absent.
          schema:
            $ref: "#/components/schemas/SearchType"
        - name: address
          in: query
          required: false
          description: Substring matched against the address and the label.
          schema:
            type: string
            maxLength: 300
        - name: ags
          in: query
          required: false
          description: Exact Amtlicher Gemeindeschlüssel (2–8 digits).
          schema:
            type: string
            pattern: "^[0-9]{2,8}$"
        - name: plz
          in: query
          required: false
          description: Exact PLZ5 or PLZ8.
          schema:
            type: string
            pattern: "^[0-9]{5}([0-9]{3})?$"
        - name: geoKey
          in: query
          required: false
          description: Exact geo_key or catalog id. Reloads a stored place; not free-text.
          schema:
            type: string
            maxLength: 200
        - name: grain
          in: query
          required: false
          description: Exact spatial grain.
          schema:
            $ref: "#/components/schemas/Grain"
      responses:
        "200":
          description: Matching hits, at most 50, ordered by label.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
              example:
                hits:
                  - id: "1"
                    label: München
                    grain: ags
                    geoKey: "09162000"
                    lon: null
                    lat: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /layers/{id}:
    get:
      tags: [Layers]
      operationId: getLayer
      summary: GeoJSON FeatureCollection for a layer
      description: |
        Returns a GeoJSON FeatureCollection as `application/json`.
        Layer rows stay in schema `app` (`map_layers`, `map_features`) until
        feature documents have coordinates. Seeded layer ids in local dev:
        `demo-gemeinden`, `demo-plz`, `demo-grid100`.
        `demo-gemeinden` has no features.
        `demo-plz` and `demo-grid100` stay synthetic points.
        Coordinates are WGS84 (EPSG:4326), longitude then latitude.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
          example: demo-gemeinden
      responses:
        "200":
          description: Layer contents. An existing layer with no features returns an empty `features` array.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureCollection"
              example:
                type: FeatureCollection
                name: Demo-Gemeinden
                description: Synthetische Demo-Geometrien.
                features:
                  - type: Feature
                    id: ags:11000000
                    geometry:
                      type: Point
                      coordinates: [13.405, 52.52]
                    properties:
                      label: Berlin
                      grain: ags
                      ags: "11000000"
                      stub: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No layer with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /analysis/input:
    get:
      tags: [Analysis]
      operationId: getAnalysisInput
      summary: Structured analysis input for the signed-in user
      description: |
        Builds the Musteranalyse input from the user's saved target region,
        store addresses, and monthly revenue (at most 36 months per store).
        A revenue change counts only between two successive calendar months
        that both have a non-null amount. `404` when no target region is
        saved. `400` when no store has two adjacent months with revenue.
      responses:
        "200":
          description: Input that a run would snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisInput"
        "400":
          description: Region exists, but monthly revenue is not sufficient.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 400
                message: Die Monatsumsätze reichen für eine Musteranalyse nicht aus. Mindestens eine Filiale braucht zwei aufeinanderfolgende Monate mit gesetztem Umsatz.
                error: Bad Request
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: This user has not saved a target region.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 404
                message: Keine Zielregion gespeichert. Bitte zuerst eine Zielregion anlegen.
                error: Not Found
  /analysis/runs:
    post:
      tags: [Analysis]
      operationId: createAnalysisRun
      summary: Snapshot input, search Brain, and persist a pattern
      description: |
        Same preconditions as `GET /analysis/input`. On success the run is
        stored for this user and includes the Brain facts used (region filter,
        plus store postal codes) and the derived pattern. The pattern is the
        input a later Top-3 step can read. This operation does not recommend
        addresses.
      responses:
        "201":
          description: Completed analysis run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisRun"
        "400":
          description: Monthly revenue is not sufficient for a pattern.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: This user has not saved a target region.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /analysis/runs/{id}:
    get:
      tags: [Analysis]
      operationId: getAnalysisRun
      summary: Read one analysis run of the signed-in user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[1-9][0-9]{0,18}$"
          description: Run id as a decimal string.
      responses:
        "200":
          description: The run, including input, Brain facts, and pattern.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No run with this id for the token's user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 404
                message: Die Analyse wurde nicht gefunden.
                error: Not Found
  /analysis/pattern:
    get:
      tags: [Analysis]
      operationId: getAnalysisPattern
      summary: Latest persisted pattern for the signed-in user
      description: |
        Returns the pattern from the newest completed run. `404` when the
        user has not completed an analysis yet.
      responses:
        "200":
          description: Latest pattern.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisPatternResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No completed analysis run for this user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 404
                message: Es liegt noch kein Muster vor. Bitte zuerst eine Analyse starten.
                error: Not Found
  /recommendations:
    post:
      tags: [Recommendations]
      operationId: createRecommendations
      summary: Rank up to three locations for the signed-in user
      description: |
        Reads a completed Musteranalyse pattern for this user (the newest run,
        or `runId` when set) and searches Brain locations in the target region.
        A location ranks when at least one pattern criterion with a direction
        moved the same way inside the six UTC calendar months ending in the
        request month. Score is the share of those directional criteria that
        match. The response has at most three items, ordered by score.

        One or two matches are success, not an error: `reason` explains the
        thin region in German. Zero matches are also success, with `reason`
        set and `items` empty. `404` when this user has no completed pattern,
        or when `runId` is not one of their runs.

        The region anchor itself is omitted when a finer positive location
        exists. Finer grains match when their `geo_key` is under the region
        key or their metadata names the region (`geo_ags`, `ags`, `plz`,
        `geo_plz`, `geo_key`). Each item's `rationale` is German and grounded
        in `criteriaEvidence`. `source` is `llm` when that text came from the
        local model, otherwise `heuristic`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendationCreate"
      responses:
        "201":
          description: Persisted recommendation set for this user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationSet"
              example:
                id: "3"
                runId: "15"
                createdAt: "2026-09-29T12:00:00.000Z"
                window:
                  from: "2026-04"
                  to: "2026-09"
                count: 1
                reason: "In der Zielregion liegt nur 1 Standort mit positiver Musterentwicklung in den letzten sechs Monaten vor."
                pattern:
                  source: heuristic
                  summary: Einwohner steigen mit dem Umsatz.
                  revenueDirection: up
                  criteria:
                    - key: einwohner
                      label: einwohner
                      direction: up
                      evidence: einwohner steigt zwischen den vorliegenden Zeiträumen.
                items:
                  - id: "plz5:80801"
                    rank: 1
                    title: Schwabing
                    location:
                      geoKey: "80801"
                      grain: plz5
                      lon: 11.58
                      lat: 48.16
                      name: Schwabing
                    score: 1
                    rationale: "Am Standort Schwabing (80801) passt das Muster in den letzten sechs Monaten. Quelle: Heuristik, ohne Sprachmodell."
                    criteriaEvidence:
                      - key: einwohner
                        label: einwohner
                        direction: up
                        patternDirection: up
                        evidence: "einwohner steigt in den letzten sechs Monaten (2026-04: 10; 2026-09: 20)."
                    source: heuristic
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No completed analysis pattern for this user, or the run id is not theirs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                noPattern:
                  summary: No completed analysis yet
                  value:
                    statusCode: 404
                    message: Es liegt noch kein Muster vor. Bitte zuerst eine Analyse starten.
                    error: Not Found
                unknownRun:
                  summary: runId is missing for this user
                  value:
                    statusCode: 404
                    message: Die Analyse wurde nicht gefunden.
                    error: Not Found
    get:
      tags: [Recommendations]
      operationId: getRecommendations
      summary: Latest recommendation set for the signed-in user
      description: |
        Returns the newest set stored by `POST /recommendations` for the token
        user. `404` when this user has not computed recommendations yet.
      responses:
        "200":
          description: Latest recommendation set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationSet"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: This user has no stored recommendations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 404
                message: Es liegen noch keine Empfehlungen vor. Bitte zuerst Empfehlungen berechnen.
                error: Not Found
  /address-pair:
    post:
      tags: [AddressPair]
      operationId: evaluateAddressPair
      summary: Compare Brain topics for two addresses
      description: |
        Street and city are labels only. The lookup key is the five-digit
        postal code. Two streets in the same PLZ return the same numbers.

        A side is `resolved` only when that PLZ maps to exactly one
        municipality and exactly one district in Brain `geo.geo_ref_plz` /
        `geo.geo_ref_admin`. Otherwise `resolution` is `unknown`, places are
        null, and `topics` is empty. `land` may be null when no Land row
        exists. Place names are never invented.

        Each resolved side returns the fixed topic lists at Gemeinde, Kreis,
        and Land. `status: present` includes `value` as the stored Brain row.
        `status: absent` omits `value`. Missing rows are never replaced with
        0, null, or `{}`. Pendler, PKS, and Unfallatlas stay separate by
        level. Arbeitsmarkt is Kreis only.

        `shared` lists topics that are present on both sides at the same id
        and level. The handler reads local Brain Postgres only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressPairRequest"
            example:
              left:
                street: Marienplatz 1
                postalCode: "80331"
                city: München
              right:
                street: Alexanderplatz 1
                postalCode: "10178"
                city: Berlin
      responses:
        "200":
          description: Both sides, plus topics present on both.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressPairResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    StoreId:
      name: id
      in: path
      required: true
      description: Store id as a decimal string.
      schema:
        type: string
        pattern: "^[1-9][0-9]{0,18}$"
    TargetRegionGeoKey:
      name: geoKey
      in: path
      required: true
      description: |
        Catalog place id stored on the list item (`geoKey`). Same value
        `GET /search` returns. A Berlin Bezirk alias is matched as the
        official AGS.
      schema:
        type: string
        minLength: 1
        maxLength: 200
  responses:
    BadRequest:
      description: Request failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
    TokenResponse:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Token lifetime in seconds.
          example: 28800
    User:
      type: object
      additionalProperties: false
      required: [id, email]
      properties:
        id:
          type: string
          description: User id as a decimal string.
        email:
          type: string
          format: email
    Grain:
      type: string
      description: Spatial grain of a hit. Matches the Datenbasis grain list used by this slice.
      enum: [address, grid100, plz8, plz5, ags, ags5, other]
    SearchType:
      type: string
      enum: [address, ags, plz]
    CatalogLevel:
      type: string
      description: |
        Machine token the web client maps to the badge. Never a German label.
        `plz`, `bezirk`, `stadtbezirk`, `stadtteil`, `ortsteil` are Brain
        `geo` sub-areas. `gemeinde` is a municipality (grain `ags`). Never
        `gemeinde` for a sub-area.
      enum: [plz, bezirk, stadtbezirk, stadtteil, ortsteil, gemeinde]
    SearchHit:
      type: object
      additionalProperties: false
      required: [id, label, grain]
      properties:
        id:
          type: string
        label:
          type: string
        grain:
          $ref: "#/components/schemas/Grain"
        geoKey:
          type: string
          nullable: true
          description: |
            Spatial key from the feature view or the geo catalog (AGS, PLZ,
            Stadtteil/Ortsteil id). Null when unknown. This is the place id
            `POST /target-region` and `DELETE /target-region/{geoKey}` use.
            It is not itself a polygon. Brain `geo` holds PLZ, Bezirk,
            Stadtteil, and Ortsteil outlines. A Berlin Bezirk alias is stored
            as `1100000N`. Free-text `q` does not match this key.
        level:
          allOf:
            - $ref: "#/components/schemas/CatalogLevel"
          nullable: true
          description: |
            Exact tokens:
            `plz` from `geo.geo_ref_plz`;
            `bezirk` only for Berlin `11000001`–`11000012`;
            `stadtbezirk` for every other `geo.geo_ref_bezirk` row;
            `stadtteil` or `ortsteil` from `geo.geo_ref_ortsteil.kind`
            (one of those two words, never both, never `gemeinde`);
            `gemeinde` for a municipality (grain `ags`). Never `gemeinde`
            for a sub-area.
        parentLabel:
          type: string
          nullable: true
          description: |
            Display name of the parent Gemeinde, not a second label for the
            area itself and not a German badge. Distinguishes same-named
            sub-areas. Null when unknown or the hit is the municipality.
        geoAgs:
          type: string
          nullable: true
          description: |
            Parent municipality AGS from the table column `geo_ags`.
            Null when the table has no value.
        lon:
          type: number
          format: double
          nullable: true
          description: WGS84 longitude. Omitted or null when the hit is not geocoded.
        lat:
          type: number
          format: double
          nullable: true
          description: WGS84 latitude. Omitted or null when the hit is not geocoded.
    SearchResponse:
      type: object
      additionalProperties: false
      required: [hits]
      properties:
        hits:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/SearchHit"
    Geometry:
      type: object
      required: [type, coordinates]
      description: GeoJSON geometry. This slice seeds Point and Polygon.
      properties:
        type:
          type: string
          enum: [Point, Polygon, MultiPolygon]
        coordinates:
          description: "GeoJSON coordinates. Position order is longitude, latitude (EPSG:4326)."
      additionalProperties: true
    Feature:
      type: object
      additionalProperties: false
      required: [type, geometry, properties]
      properties:
        type:
          type: string
          enum: [Feature]
        id:
          type: string
        geometry:
          $ref: "#/components/schemas/Geometry"
        properties:
          type: object
          additionalProperties: true
          description: "Includes label, grain, and stub: true for seeded demo features."
    FeatureCollection:
      type: object
      additionalProperties: false
      required: [type, features]
      description: |
        GeoJSON FeatureCollection. `name` and `description` are foreign members
        carried for this API (RFC 7946 allows them).
      properties:
        type:
          type: string
          enum: [FeatureCollection]
        name:
          type: string
        description:
          type: string
        features:
          type: array
          items:
            $ref: "#/components/schemas/Feature"
    LonLatBounds:
      type: object
      additionalProperties: false
      required: [west, south, east, north]
      description: |
        Axis-aligned WGS84 extent for map fitBounds. `west` and `east` are
        longitudes, `south` and `north` are latitudes. Clients union this box
        with store pin coordinates.
      properties:
        west:
          type: number
          format: double
          minimum: -180
          maximum: 180
        south:
          type: number
          format: double
          minimum: -90
          maximum: 90
        east:
          type: number
          format: double
          minimum: -180
          maximum: 180
        north:
          type: number
          format: double
          minimum: -90
          maximum: 90
    RegionGeometry:
      type: object
      additionalProperties: true
      required: [type, coordinates]
      description: |
        GeoJSON Polygon or MultiPolygon for the target-region overlay
        (semi-transparent fill and outline). Position order is longitude,
        latitude (EPSG:4326). Rings are closed. This slice uses the same
        synthetic stubs as `/layers/{id}` when the client does not send one.
      properties:
        type:
          type: string
          enum: [Polygon, MultiPolygon]
        coordinates:
          description: GeoJSON coordinates for the declared type.
    TargetRegion:
      type: object
      additionalProperties: false
      required: [label, bounds, geometry, updatedAt]
      description: |
        One saved place in the user's target-region list. Display fields
        match a search hit: `label`, `level`, `parentLabel`. `geoKey` names
        the place for add and remove.
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 200
          description: Place name. Same field as `SearchHit.label`.
        grain:
          type: string
          nullable: true
          enum: [address, grid100, plz8, plz5, ags, ags5, other]
          description: Same values as Grain. Null when the region is a free-text label.
        geoKey:
          type: string
          nullable: true
          maxLength: 200
          description: |
            Stored catalog key. A Berlin Bezirk alias sent on add is returned
            as the official AGS `1100000N`. Clients use this to remove the
            item. It is not a display field.
        level:
          allOf:
            - $ref: "#/components/schemas/CatalogLevel"
          nullable: true
          description: |
            Same tokens as `SearchHit.level`. `plz`; `bezirk` only for Berlin
            `11000001`–`11000012`; `stadtbezirk` for every other Bezirk;
            `stadtteil` or `ortsteil` from the catalog kind; `gemeinde` for
            a municipality (grain `ags`). Never `gemeinde` for a sub-area.
        parentLabel:
          type: string
          nullable: true
          description: |
            Parent municipality name, same as `SearchHit.parentLabel`. Not a
            second name for the area. Null when unknown or the item is the
            municipality.
        ags:
          type: string
          nullable: true
          pattern: "^[0-9]{2,8}$"
          description: |
            Stored official AGS. Add rewrites `11006006` to `11000006` and
            `11007007` to `11000007`.
        plz:
          type: string
          nullable: true
          pattern: "^[0-9]{5}([0-9]{3})?$"
        lon:
          type: number
          format: double
          nullable: true
          minimum: -180
          maximum: 180
          description: WGS84 longitude of a representative point. Null when unknown.
        lat:
          type: number
          format: double
          nullable: true
          minimum: -90
          maximum: 90
          description: WGS84 latitude of a representative point. Null when unknown.
        bounds:
          nullable: true
          description: |
            Extent of `geometry` for map fitBounds. Null on `GET` only when a
            previously stored region still has no outline and the catalog has
            no point. A successful add always returns bounds.
          allOf:
            - $ref: "#/components/schemas/LonLatBounds"
        geometry:
          nullable: true
          description: |
            Overlay polygon. Null on `GET` only when a previously stored
            region still has no outline and the catalog has none. A successful
            add always returns a Polygon or MultiPolygon.
          allOf:
            - $ref: "#/components/schemas/RegionGeometry"
        updatedAt:
          type: string
          format: date-time
    TargetRegionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          description: Saved places, newest add first. Empty when none are stored.
          items:
            $ref: "#/components/schemas/TargetRegion"
    TargetRegionWrite:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 200
        grain:
          type: string
          nullable: true
          enum: [address, grid100, plz8, plz5, ags, ags5, other]
        geoKey:
          type: string
          nullable: true
          maxLength: 200
          description: |
            Place id. A Berlin Bezirk alias `11` + nnn + nnn is stored as the
            official AGS `1100000N` (an `ags:` prefix is kept).
        ags:
          type: string
          nullable: true
          pattern: "^[0-9]{2,8}$"
          description: |
            Official AGS. Berlin Bezirk aliases such as `11006006` and
            `11007007` are stored as `11000006` and `11000007`.
        plz:
          type: string
          nullable: true
          pattern: "^[0-9]{5}([0-9]{3})?$"
        lon:
          type: number
          format: double
          nullable: true
          minimum: -180
          maximum: 180
        lat:
          type: number
          format: double
          nullable: true
          minimum: -90
          maximum: 90
        bounds:
          nullable: true
          description: |
            Optional extent. Ignored. Bounds on a successful add are derived
            from the stored polygon. Bounds without a polygon do not become
            a rectangle. A successful add always returns non-null `bounds`.
          allOf:
            - $ref: "#/components/schemas/LonLatBounds"
        geometry:
          nullable: true
          description: |
            Optional GeoJSON Polygon or MultiPolygon (EPSG:4326). When set, it
            is the overlay and replaces any catalog outline. A place id from
            `GET /search` is not an outline. A successful add never persists
            null geometry. If this is omitted and the catalog has no polygon,
            the add is `400`.
          allOf:
            - $ref: "#/components/schemas/RegionGeometry"
    StoreLocation:
      type: object
      additionalProperties: false
      required: [id, street, postalCode, city, countryCode, createdAt, updatedAt]
      properties:
        id:
          type: string
          description: Store id as a decimal string.
        label:
          type: string
          nullable: true
          maxLength: 120
          description: Optional store name.
        street:
          type: string
          minLength: 1
          maxLength: 200
          description: Street and house number.
        postalCode:
          type: string
          pattern: "^[0-9]{5}$"
          description: German PLZ5.
        city:
          type: string
          minLength: 1
          maxLength: 120
        countryCode:
          type: string
          enum: [DE]
        lon:
          type: number
          format: double
          nullable: true
          minimum: -180
          maximum: 180
          description: |
            WGS84 longitude for the map pin. Resolved, when a write omits both
            coordinates, from Data-Scout `geo_ref_address`, then `geo_ref_plz`,
            then the PLZ stub in `app.search_places` or `app.map_features`.
        lat:
          type: number
          format: double
          nullable: true
          minimum: -90
          maximum: 90
          description: |
            WGS84 latitude for the map pin. Resolved, when a write omits both
            coordinates, from Data-Scout `geo_ref_address`, then `geo_ref_plz`,
            then the PLZ stub in `app.search_places` or `app.map_features`.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    StoreLocationWrite:
      type: object
      additionalProperties: false
      required: [street, postalCode, city]
      properties:
        label:
          type: string
          nullable: true
          maxLength: 120
        street:
          type: string
          minLength: 1
          maxLength: 200
        postalCode:
          type: string
          pattern: "^[0-9]{5}$"
        city:
          type: string
          minLength: 1
          maxLength: 120
        countryCode:
          type: string
          enum: [DE]
          default: DE
        lon:
          type: number
          format: double
          nullable: true
          minimum: -180
          maximum: 180
          description: |
            WGS84 longitude. Omit together with `lat` to resolve
            `geo_ref_address`, then `geo_ref_plz`, then the PLZ stub.
        lat:
          type: number
          format: double
          nullable: true
          minimum: -90
          maximum: 90
          description: |
            WGS84 latitude. Omit together with `lon` to resolve
            `geo_ref_address`, then `geo_ref_plz`, then the PLZ stub.
    StoreList:
      type: object
      additionalProperties: false
      required: [stores]
      properties:
        stores:
          type: array
          items:
            $ref: "#/components/schemas/StoreLocation"
    MonthlyRevenuePoint:
      type: object
      additionalProperties: false
      required: [year, month, revenueEur, updatedAt]
      properties:
        year:
          type: integer
          minimum: 1990
          maximum: 2100
        month:
          type: integer
          minimum: 1
          maximum: 12
        revenueEur:
          type: number
          format: double
          nullable: true
          minimum: 0
          description: EUR. Null means the month was marked missing.
        updatedAt:
          type: string
          format: date-time
    MonthlyRevenuePointWrite:
      type: object
      additionalProperties: false
      required: [year, month, revenueEur]
      properties:
        year:
          type: integer
          minimum: 1990
          maximum: 2100
        month:
          type: integer
          minimum: 1
          maximum: 12
        revenueEur:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 9999999999.99
    MonthlyRevenueSeries:
      type: object
      additionalProperties: false
      required: [points]
      properties:
        points:
          type: array
          maxItems: 36
          items:
            $ref: "#/components/schemas/MonthlyRevenuePoint"
    MonthlyRevenueWrite:
      type: object
      additionalProperties: false
      required: [points]
      properties:
        points:
          type: array
          minItems: 1
          maxItems: 36
          items:
            $ref: "#/components/schemas/MonthlyRevenuePointWrite"
    AnalysisInput:
      type: object
      additionalProperties: false
      required: [region, stores, revenueDirection, capturedAt]
      description: |
        Snapshot of customer inputs used for Musteranalyse. `regions` is the
        saved target-region list (the set for the location search). `region`
        is the newest item and stays for older snapshots that only stored one
        place. `stores[].points` holds up to 36 months. `changes` links only
        successive calendar months that both have a revenue.
      properties:
        region:
          $ref: "#/components/schemas/TargetRegion"
        regions:
          type: array
          description: |
            Full target-region list at snapshot time, newest first. Location
            search uses this set. Omitted on runs created before the list.
          items:
            $ref: "#/components/schemas/TargetRegion"
        stores:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisStore"
        revenueDirection:
          $ref: "#/components/schemas/RevenueDirection"
        capturedAt:
          type: string
          format: date-time
    AnalysisStore:
      type: object
      additionalProperties: false
      required: [id, street, postalCode, city, points, changes]
      properties:
        id:
          type: string
        label:
          type: string
          nullable: true
        street:
          type: string
        postalCode:
          type: string
          pattern: "^[0-9]{5}$"
        city:
          type: string
        lon:
          type: number
          format: double
          nullable: true
        lat:
          type: number
          format: double
          nullable: true
        points:
          type: array
          maxItems: 36
          items:
            $ref: "#/components/schemas/AnalysisRevenuePoint"
        changes:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisRevenueChange"
    AnalysisRevenuePoint:
      type: object
      additionalProperties: false
      required: [year, month, revenueEur]
      properties:
        year:
          type: integer
          minimum: 1990
          maximum: 2100
        month:
          type: integer
          minimum: 1
          maximum: 12
        revenueEur:
          type: number
          format: double
          nullable: true
          minimum: 0
    AnalysisRevenueChange:
      type: object
      additionalProperties: false
      required: [fromYear, fromMonth, toYear, toMonth, fromRevenueEur, toRevenueEur, changeEur]
      properties:
        fromYear:
          type: integer
        fromMonth:
          type: integer
        toYear:
          type: integer
        toMonth:
          type: integer
        fromRevenueEur:
          type: number
          format: double
        toRevenueEur:
          type: number
          format: double
        changeEur:
          type: number
          format: double
          description: toRevenueEur minus fromRevenueEur, rounded to cents.
    RevenueDirection:
      type: string
      description: Sign of the summed month-to-month revenue changes. Flat means the sum is zero.
      enum: [up, down, flat]
    CriterionDirection:
      type: string
      description: |
        Direction of one Brain criterion. `unknown` means the facts do not
        show a change over time (often a single reference period).
      enum: [up, down, flat, unknown]
    AnalysisRun:
      type: object
      additionalProperties: false
      required: [id, status, createdAt, input, brain, pattern]
      properties:
        id:
          type: string
          description: Run id as a decimal string.
        status:
          type: string
          enum: [completed]
        createdAt:
          type: string
          format: date-time
        input:
          $ref: "#/components/schemas/AnalysisInput"
        brain:
          $ref: "#/components/schemas/AnalysisBrain"
        pattern:
          $ref: "#/components/schemas/AnalysisPattern"
    AnalysisBrain:
      type: object
      additionalProperties: false
      required: [mode, factCount, facts]
      description: |
        Facts retrieved for this run. `vector` means cosine similarity over
        Brain embeddings, filtered to the target region and store postal
        codes. `sql` means the same filters without a vector (embeddings
        unset, unreachable, or not usable). This is not a raw Brain dump.
      properties:
        mode:
          type: string
          enum: [vector, sql]
        vectorUnavailableReason:
          type: string
          nullable: true
          enum:
            - embeddings_disabled
            - embeddings_unconfigured
            - embeddings_unreachable
            - embeddings_rejected
            - vector_query_failed
            - no_embeddings_in_region
            - features_unavailable
          description: |
            Why `mode` is `sql`. Null when `mode` is `vector`.
        factCount:
          type: integer
          minimum: 0
          description: Number of facts included on this run.
        facts:
          type: array
          items:
            $ref: "#/components/schemas/BrainFact"
    BrainFact:
      type: object
      additionalProperties: false
      required: [id, geoKey, grain, title, excerpt, matchedBy, signals]
      properties:
        id:
          type: string
        geoKey:
          type: string
        grain:
          $ref: "#/components/schemas/Grain"
        title:
          type: string
        name:
          type: string
          nullable: true
        refPeriod:
          type: string
          nullable: true
        excerpt:
          type: string
          description: Short prose from the feature document, or the title when no prose is stored.
        distance:
          type: number
          format: double
          nullable: true
          description: Cosine distance when mode is vector. Null for the SQL filter.
        matchedBy:
          type: string
          enum: [region, store, label]
          description: |
            `region` matches the target region ags, plz, or geoKey.
            `store` matches a store postal code.
            `label` is the text fallback when the region has no geo key.
        signals:
          type: array
          maxItems: 6
          items:
            $ref: "#/components/schemas/BrainSignal"
    BrainSignal:
      type: object
      additionalProperties: false
      required: [key, value]
      properties:
        key:
          type: string
        value:
          type: string
    SeriesLevel:
      type: string
      description: |
        Level the stored Brain row actually belongs to. Separate from the
        requested Zielregion level. Gemeinde or Kreis numbers are never
        labeled as Stadtteil, Ortsteil, PLZ, or Stadtbezirk.
      enum: [plz, bezirk, stadtbezirk, stadtteil, ortsteil, gemeinde, kreis, land]
    SeriesGranularity:
      type: string
      enum: [month, year]
    SeriesCoverage:
      type: string
      description: |
        How many stored Brain periods exist in the three-year window.
        `none` — every period liegt nicht vor.
        `single` — exactly one present point; do not draw a trend line.
        `multi` — two or more present points (a change can be shown).
      enum: [none, single, multi]
    SeriesPointStatus:
      type: string
      description: |
        `absent` means the period liegt nicht vor. `value` is omitted.
        Never 0, null, or {} as a stand-in. A stored 0 is `present`.
      enum: [present, absent]
    SeriesPoint:
      type: object
      additionalProperties: false
      required: [period, status]
      properties:
        period:
          type: string
          description: |
            Calendar stamp. `YYYY` when granularity is year, `YYYY-MM` when
            month. Theme suffixes on Brain `ref_period` (`2025-12|bka`) are
            stripped. A quarter such as `2026-Q1` is the year `2026`, not a
            fabricated month.
          pattern: "^[0-9]{4}(-[0-9]{2})?$"
        status:
          $ref: "#/components/schemas/SeriesPointStatus"
        value:
          type: number
          description: Stored Brain cell for this period. Omitted when absent.
    YearlySeries:
      type: object
      additionalProperties: false
      required:
        - metricId
        - requestedLevel
        - requestedGeoKey
        - sourceLevel
        - sourceGeoKey
        - granularity
        - coverage
        - points
      description: |
        One topic on one Zielregion over the last three UTC calendar years
        (`year`) or the last 36 UTC months (`month`). When the newest Brain
        year is older than `asOf` but still within two years, the year
        window ends on that Brain year so a series such as Wanderungen
        through 2024 stays `multi`. `coverage` tells the client whether a
        trend exists. `sourceLevel` / `sourceGeoKey` are the Brain row, not
        the picker grain. Unfallatlas Gebiet may be Ortsteil, Bezirk, or
        PLZ when that key exists; Gemeinde/Kreis/Land AGS series stay on
        grain `ags` / `ags5` / `other` and are labeled as such. Missing
        cells are `absent` without `value`. Store revenue is not included.
      properties:
        metricId:
          type: string
          description: |
            Address-pair topic id (`bevoelkerung`, `pendler`, …) or a Brain
            series theme id (`destatis_wohnungen`, `kba_elektro_pkw`, …).
            Not store revenue.
        requestedLevel:
          $ref: "#/components/schemas/CatalogLevel"
        requestedGeoKey:
          type: string
        sourceLevel:
          $ref: "#/components/schemas/SeriesLevel"
        sourceGeoKey:
          type: string
          description: Geo key of the Brain row, or the Gemeinde/Kreis/Land key that was looked up.
        granularity:
          $ref: "#/components/schemas/SeriesGranularity"
        coverage:
          $ref: "#/components/schemas/SeriesCoverage"
        valueKey:
          type: string
          description: Metadata field the `value` numbers were taken from, when the row is an object.
        points:
          type: array
          description: |
            Every expected period in the window. Missing Brain rows are
            `absent` without `value`. Present points are stored cells only.
          items:
            $ref: "#/components/schemas/SeriesPoint"
    AnalysisPattern:
      type: object
      additionalProperties: false
      required: [source, summary, revenueDirection, criteria]
      description: |
        Persisted pattern for a later Top-3 step. `source` is `llm` when the
        criteria were taken from the language model and checked against the
        retrieved facts, otherwise `heuristic`. `yearlySeries` is the
        three-year small-area Brain history for the user's Zielregionen.
        It is not store revenue. A `coverage` of `single` is not a trend.
      properties:
        source:
          type: string
          enum: [llm, heuristic]
        summary:
          type: string
        revenueDirection:
          $ref: "#/components/schemas/RevenueDirection"
        criteria:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/PatternCriterion"
        yearlySeries:
          type: array
          items:
            $ref: "#/components/schemas/YearlySeries"
    PatternCriterion:
      type: object
      additionalProperties: false
      required: [key, label, direction, evidence]
      properties:
        key:
          type: string
          maxLength: 120
        label:
          type: string
        direction:
          $ref: "#/components/schemas/CriterionDirection"
        evidence:
          type: string
          description: Grounded in the retrieved Brain facts or the stored revenue series.
    AnalysisPatternResponse:
      type: object
      additionalProperties: false
      required: [runId, createdAt, pattern]
      properties:
        runId:
          type: string
        createdAt:
          type: string
          format: date-time
        pattern:
          $ref: "#/components/schemas/AnalysisPattern"
    RecommendationCreate:
      type: object
      additionalProperties: false
      description: |
        Optional body for `POST /recommendations`. Omit `runId` to use the
        newest completed analysis run of the token user.
      properties:
        runId:
          type: string
          pattern: "^[1-9][0-9]{0,18}$"
          description: Analysis run id as a decimal string. Must belong to the token user.
    RecommendationSet:
      type: object
      additionalProperties: false
      required: [id, runId, createdAt, window, count, reason, pattern, items]
      description: |
        Top-3 payload the web client binds to. `count` is `items.length` and
        is never greater than 3. `reason` is null when three positive locations
        were available. `pattern` is the snapshot used for this ranking.
      properties:
        id:
          type: string
          description: Recommendation set id as a decimal string.
        runId:
          type: string
          description: Analysis run this set was ranked from.
        createdAt:
          type: string
          format: date-time
        window:
          $ref: "#/components/schemas/RecommendationWindow"
        count:
          type: integer
          minimum: 0
          maximum: 3
        reason:
          type: string
          nullable: true
          description: |
            German explanation when fewer than three locations are returned,
            or when the Brain read hit its row limit. Null when three matches
            were ranked without truncation.
        pattern:
          $ref: "#/components/schemas/AnalysisPattern"
        items:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/Recommendation"
    RecommendationWindow:
      type: object
      additionalProperties: false
      required: [from, to]
      description: |
        Six calendar months, inclusive, ending in the UTC month of the request.
        Brain `ref_period` values outside this window do not affect the score.
      properties:
        from:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}$"
          description: Oldest month in the window (`YYYY-MM`).
          example: "2026-04"
        to:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}$"
          description: Newest month in the window (`YYYY-MM`).
          example: "2026-09"
    Recommendation:
      type: object
      additionalProperties: false
      required: [id, rank, title, location, score, rationale, criteriaEvidence, source]
      properties:
        id:
          type: string
          description: Stable location id `{grain}:{geoKey}` inside this set.
          example: "plz5:80801"
        rank:
          type: integer
          minimum: 1
          maximum: 3
        title:
          type: string
          description: Card title. Place name, address line, or geo key from Brain.
        location:
          $ref: "#/components/schemas/RecommendationLocation"
        score:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: |
            Share of pattern criteria that have a direction and moved the same
            way at this location inside the window. 1 is a full fit.
        rationale:
          type: string
          description: |
            German Begründung. Names only criteria and figures present in
            `criteriaEvidence`.
        criteriaEvidence:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/RecommendationEvidence"
        source:
          type: string
          enum: [llm, heuristic]
          description: |
            `llm` when `rationale` was taken from the local model and checked
            against `criteriaEvidence`. `heuristic` when the model was unset,
            failed, or its text was discarded.
    RecommendationLocation:
      type: object
      additionalProperties: false
      required: [geoKey, grain, lon, lat, name]
      properties:
        geoKey:
          type: string
        grain:
          $ref: "#/components/schemas/Grain"
        lon:
          type: number
          format: double
          nullable: true
        lat:
          type: number
          format: double
          nullable: true
        name:
          type: string
          nullable: true
          description: Brain place name when the row has one.
    RecommendationEvidence:
      type: object
      additionalProperties: false
      required: [key, label, direction, patternDirection, evidence]
      description: |
        One pattern criterion that moved in the pattern direction at this
        location. `direction` is what Brain shows in the window.
        `patternDirection` is the saved Musteranalyse direction.
      properties:
        key:
          type: string
        label:
          type: string
        direction:
          $ref: "#/components/schemas/CriterionDirection"
        patternDirection:
          $ref: "#/components/schemas/CriterionDirection"
        evidence:
          type: string
          description: German sentence with the months and figures used for the score.
    AddressPairRequest:
      type: object
      additionalProperties: false
      required: [left, right]
      properties:
        left:
          $ref: "#/components/schemas/AddressInput"
        right:
          $ref: "#/components/schemas/AddressInput"
    AddressInput:
      type: object
      additionalProperties: false
      required: [street, postalCode, city]
      properties:
        street:
          type: string
          minLength: 1
          maxLength: 200
        postalCode:
          type: string
          pattern: "^[0-9]{5}$"
        city:
          type: string
          minLength: 1
          maxLength: 120
    AddressPairResult:
      type: object
      additionalProperties: false
      required: [left, right, shared]
      properties:
        left:
          $ref: "#/components/schemas/AddressSide"
        right:
          $ref: "#/components/schemas/AddressSide"
        shared:
          type: array
          items:
            $ref: "#/components/schemas/SharedTopic"
    AddressSide:
      type: object
      additionalProperties: false
      required: [input, resolution, gemeinde, kreis, land, topics]
      properties:
        input:
          $ref: "#/components/schemas/AddressInput"
        resolution:
          $ref: "#/components/schemas/AddressResolution"
        gemeinde:
          allOf:
            - $ref: "#/components/schemas/PlaceName"
          nullable: true
        kreis:
          allOf:
            - $ref: "#/components/schemas/PlaceName"
          nullable: true
        land:
          allOf:
            - $ref: "#/components/schemas/PlaceName"
          nullable: true
        topics:
          type: array
          items:
            $ref: "#/components/schemas/AddressTopic"
    AddressResolution:
      type: string
      enum: [resolved, unknown]
    PlaceName:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
    AddressTopic:
      type: object
      additionalProperties: false
      required: [id, level, status]
      properties:
        id:
          type: string
          minLength: 1
        level:
          $ref: "#/components/schemas/TopicLevel"
        status:
          $ref: "#/components/schemas/TopicStatus"
        value:
          description: |
            Stored Brain row. Present only when `status` is `present`.
            Omitted entirely when `status` is `absent`.
    SharedTopic:
      type: object
      additionalProperties: false
      required: [id, level, left, right]
      properties:
        id:
          type: string
          minLength: 1
        level:
          $ref: "#/components/schemas/TopicLevel"
        left: {}
        right: {}
    TopicLevel:
      type: string
      enum: [gemeinde, kreis, land]
    TopicStatus:
      type: string
      enum: [present, absent]
    ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        error:
          type: string
