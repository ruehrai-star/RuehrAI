# Local development only. The database password below is a published dev default,
# not a production secret. Postgres is bound to localhost.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ruehrai
      POSTGRES_PASSWORD: ruehrai
      POSTGRES_DB: ruehrai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ruehrai_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruehrai -d ruehrai"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  ruehrai_pg_data:
