name: Android

on:
  pull_request:
    paths:
      - "apps/android/**"
      - "packages/api-contracts/**"
      - ".github/workflows/android.yml"
  push:
    branches:
      - main
    paths:
      - "apps/android/**"
      - "packages/api-contracts/**"
      - ".github/workflows/android.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v6

      - name: Lint, unit tests, and assembleDebug
        working-directory: apps/android
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug --stacktrace
