name: web

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/api-contracts/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/web.yml"
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/api-contracts/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/web.yml"

jobs:
  check:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @ruehrai/web lint

      - name: Typecheck
        run: pnpm --filter @ruehrai/web typecheck

      - name: Test
        run: pnpm --filter @ruehrai/web test

      - name: Build
        run: pnpm --filter @ruehrai/web build
