name: backend

on:
  pull_request:
    paths:
      - "apps/backend/**"
      - "packages/api-contracts/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/backend.yml"
  push:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - "packages/api-contracts/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/backend.yml"

jobs:
  check:
    name: "backend: lint, typecheck, test"
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: overlap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d overlap_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      POSTGIS_URL: postgresql://postgres:postgres@localhost:5432/overlap_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @ruehrai/backend run --if-present lint

      - name: Typecheck
        run: pnpm --filter @ruehrai/backend build

      - name: Test
        run: pnpm --filter @ruehrai/backend test

      - name: Load test (3 stores × ~2000, GET /health)
        run: pnpm --filter @ruehrai/backend test -- src/analysis/analysis.load.http.spec.ts --runInBand

      - name: API contracts
        run: pnpm --filter @ruehrai/api-contracts test
